# Mosquitto do servidor da Physis: só na rede interna "iot" (hub e Node-RED). Sem porta publicada.
# Campo: as Caixinhas falam com o Mosquitto do Pi do cliente (implantacao/instalar.sh --mosquitto).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/senhas
acl_file /mosquitto/config/acl
listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout
