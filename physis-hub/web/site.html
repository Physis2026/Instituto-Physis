fieldset{border:1px solid var(--linha);border-radius:12px;padding:10px 14px;margin:12px 0 0}

async function pedir(rota, corpo) {
  const op = { headers: { "Content-Type": "application/json" }, credentials: "same-origin" };
  if (corpo !== undefined) { op.method = "POST"; op.body = JSON.stringify(corpo); if (inst && inst.csrf) op.headers["X-Physis-CSRF"] = inst.csrf; }
  const r = await fetch(rota, op);
  let j = {}; try { j = await r.json(); } catch (e) {}
  j._status = r.status;
  return j;
}

  document.documentElement.lang = lang === "en" ? "en" : "pt-BR";

function ligar() {
  if (CAT_DA_ABA[aba]) forum(CAT_DA_ABA[aba]);
  if (aba === "participar") {
    forum("eventos", "forum-eventos");
    agenda(); formAgenda();
    document.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { tipoAgenda = b.getAttribute("data-tipo");
      document.querySelectorAll("[data-tipo]").forEach(o => { const sim = o.getAttribute("data-tipo") === tipoAgenda;
        o.className = "botao" + (sim ? "" : " sec"); o.setAttribute("aria-pressed", String(sim)); }); agenda(); });
  }
  if (aba === "inovastem") { biblioteca(); forum3d(); }
  if (aba === "participar") {
    moderacao();
    const f = $("cad");
    if (f) {
      f.querySelectorAll('input[name="idade"]').forEach(r => r.onchange = () => { $("cad-resp").hidden = f.querySelector('input[name="idade"]:checked').value !== "menor"; });
      f.onsubmit = async ev => {
        ev.preventDefault();
        const maior = f.querySelector('input[name="idade"]:checked').value === "maior";
        const corpo = { nome: $("cad-nome").value, usuario: $("cad-email").value, senha: $("cad-senha").value, nome_publico: $("cad-pub").value,
                        maior_de_idade: maior, delas: $("cad-delas").checked, consentimento: { aceito: $("cad-aceite").checked, versao: "1" } };
        if (!maior) { corpo.responsavel_nome = $("cad-resp-nome").value; corpo.responsavel_email = $("cad-resp-email").value; }
        const r = await pedir("/api/publico/cadastro", corpo);
        $("cad-msg").textContent = r.ok ? t("cad_ok") + (r.pode_publicar ? "" : " " + t("cad_menor_aviso")) : (r.erro || t("sem_hub"));
        $("cad-msg").className = "msg" + (r.ok ? "" : " erro");
        if (r.ok) { f.reset(); $("cad-resp").hidden = true; }
      };
    }
    const ds = $("eu-delas-salvar");
    if (ds) ds.onclick = async () => { const r = await pedir("/api/comunidade/delas", { autodeclaro: $("eu-delas").checked });
      $("eu-msg").textContent = r.ok ? "✓" : (r.erro || t("sem_hub")); if (r.ok) await carregarEu(); };
    const sa = $("eu-sair");
    if (sa) sa.onclick = async () => { if (!confirm(t("eu_sair_aviso"))) return; const r = await pedir("/api/comunidade/sair", {});
      $("eu-msg").textContent = r.ok ? "✓" : (r.erro || t("sem_hub")); await carregarEu(); desenhar(); };
  }
}

async function carregarEu() {
  eu = null;
  if (inst && inst.autenticado) { const j = await pedir("/api/comunidade/eu"); if (j.ok) eu = j; }
}

function irPara() {
  const h0 = (location.hash || "#inicio").slice(1), h = ANTIGAS[h0] || h0;
  aba = ABAS.includes(h) ? h : "inicio";
  topicoAberto = null;
  desenhar();
}

async function iniciar() {
  aplicarIdioma(); desenharAbas(); rodape();
  $("estado").textContent = t("carregando");
  try { inst = await pedir("/api/instancia"); } catch (e) { inst = null; }
  $("estado").textContent = inst ? "" : t("sem_hub");
  await carregarEu();
  window.addEventListener("hashchange", irPara);
  irPara();
}
