<title>InovaSTEM</title>
<meta name="description" content="InovaSTEM: rede aberta de troca de informações, parcerias e desafios de modelagem com códigos abertos (GIS, BIM, 3D e simulação). InovaSTEM Delas: formação e rede de mulheres em STEM. Versão beta.">
<!-- Site e plataforma da InovaSTEM como living lab online (D94, 19/11/2026). Servido pela instalação "inovastem" em "/";
     a plataforma (com login) fica em /plataforma/ e o Planejador (GIS e BIM) em /planejador. Não chama a internet: só as rotas
     do próprio servidor (/api/instancia, /api/publico/*, /api/comunidade/*, /api/inovastem/*). docs/INOVASTEM.md. -->
<script>(function(){var r=document.documentElement,t=null,p=null;try{p=JSON.parse(localStorage.getItem("physis-pref")||"null");t=p&&p.tema||localStorage.getItem("physis-pref-tema");}catch(e){}if(t!=="claro"&&t!=="escuro"){try{t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";}catch(e){t="claro";}}r.setAttribute("data-tema",t);})();</script>
<style>
@font-face{font-family:"Josefin Sans";src:url("/fontes/JosefinSans.ttf") format("truetype");font-weight:100 700;font-display:swap}
@font-face{font-family:Lora;src:url("/fontes/Lora.ttf") format("truetype");font-weight:400 700;font-display:swap}
/* Guia de Identidade da Família Physis (19/11/2026), Opção B · marcas endossadas. Cores SEM alteração (docs/PALETA.md):
   base comum: verde profundo #0B3D2E, carvão #1B1F23, creme #F4F1EA, laranja semente #F97316 (só semente, ícones e
   números de destaque; nunca texto branco sobre ele), laranja de botão #C2410C (botão com texto branco);
   InovaSTEM: fundo claro #FFF7ED, assinatura #F97316, versão escura creme + laranja;
   InovaSTEM Delas: fundo #EDE9FE, roxo #7C3AED, versão escura lilás claro #C4B5FD + laranja.
   Proporção 60/30/10. Tipografia: Josefin Sans (títulos e nome) e Lora (texto); sem internet: usa a fonte instalada ou
   a reserva da pilha. Arquivos (licença OFL) em web/fontes, servidos em /fontes/. Logos: as imagens do guia, sem alteração,
   versão clara no tema claro e versão escura no tema escuro.
   Tipos de tela (dona, 20/11/2026; PALETA.md, "Tipos de tela"): claro = tipo B; escuro = tipo A (verde profundo); Delas no
   escuro = roxo profundo. Roxo só na InovaSTEM Delas. Avisos: verde profundo (ok) e terracota (atenção e erro; o laranja fica só para a marca).
   Tipografia (dona, 20/11): Josefin Sans só no logo e em títulos grandes (h2, 24 px ou mais, peso 400); o resto em Lora, caixa normal. Linhas e bordas: neutros
   esverdeados e areia da PALETA.md. Sem azul. */
:root{
  color-scheme:light;
  --fundo:#FFF7ED;--sup:#FFFFFF;--campo:#FFFFFF;--texto:#1B1F23;--tinta2:#4A4F44;--titulo-cor:#1A4D2E;--link:#1A4D2E;
  --acao:#C2410C;--sobre-acao:#FFFFFF;--sec:#1A4D2E;--sobrancelha:#C2410C;--semente:#F97316;--numero:#F97316;
  --faixa:#0B3D2E;--sobre-faixa:#F4F1EA;--terracota:#BB6B4A;--rodape:#0B3D2E;--linha:#D9D3C2;--borda-campo:#8A9284;--suave:#F4F1EA;
  --delas:#7C3AED;--delas-f:#EDE9FE;--delas-t:#7C3AED;--sobre-delas:#FFFFFF;
  --ok-f:#F4F1EA;--ok-t:#0B3D2E;--al-f:#F5E2D7;--al-t:#7A2214;--at-f:#F5E2D7;--at-t:#7A2214;--erro-msg:#7A2214;
  --titulo:"Josefin Sans","Century Gothic",Futura,"Segoe UI",system-ui,sans-serif;
  --fonte:Lora,Georgia,"Times New Roman",serif;
}
html[data-tema="escuro"]{
  color-scheme:dark;
  --fundo:#0B3D2E;--sup:#0F4535;--campo:#0B3D2E;--texto:#F4F1EA;--tinta2:#C3D0BD;--titulo-cor:#F4F1EA;--link:#F4F1EA;
  --acao:#C2410C;--sobre-acao:#FFFFFF;--sec:#F4F1EA;--sobrancelha:#D9A58C;--semente:#F97316;--numero:#F97316;
  --faixa:#2F5E4E;--sobre-faixa:#F4F1EA;--terracota:#BB6B4A;--rodape:#0F4535;--linha:#2F5E4E;--borda-campo:#8A9182;--suave:#0B3D2E;
  --delas:#7C3AED;--delas-f:#3D2A5C;--delas-t:#C4B5FD;--sobre-delas:#FFFFFF;
  --ok-f:#0B3D2E;--ok-t:#F4F1EA;--al-f:#0B3D2E;--al-t:#D9A58C;--at-f:#0B3D2E;--at-t:#D9A58C;--erro-msg:#D9A58C;
}
/* InovaSTEM Delas no escuro: roxo profundo (tipo Delas), lilás, verde #8FB183 e laranja */
html[data-tema="escuro"] body.aba-delas{
  --fundo:#2B2143;--sup:#3D2A5C;--campo:#2B2143;--linha:#5B4A7A;--tinta2:#C4B5FD;--suave:#2B2143;
  --delas-f:#3D2A5C;--faixa:#3D2A5C;--ok-f:#2B2143;--al-f:#2B2143;--at-f:#2B2143;--rodape:#3D2A5C;
}
html[data-tema="escuro"] .so-claro,html:not([data-tema="escuro"]) .so-escuro{display:none}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:1.05rem/1.6 var(--fonte);overflow-wrap:anywhere}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.pular{position:absolute;left:-9999px;top:8px;background:var(--acao);color:var(--sobre-acao);padding:8px 14px;border-radius:8px;z-index:10}
.pular:focus{left:8px}
.in{max-width:1180px;margin:0 auto;padding:0 16px}
.endosso{background:var(--faixa);color:var(--sobre-faixa);font:400 .9rem/1.4 var(--fonte)}
.endosso .in{display:flex;justify-content:flex-end;align-items:center;min-height:36px;gap:6px}
.marca-physis{font-family:var(--titulo);letter-spacing:.18em;text-transform:uppercase}
header{border-bottom:1px solid var(--linha);padding:10px 0;background:var(--fundo)}
.ferramentas{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.cabeca{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:6px}
h1.logo{margin:0;line-height:0}
h1.logo a{display:inline-block;border-radius:8px}
h1.logo img{height:64px;width:auto}
html[data-tema="escuro"] h1.logo img,html[data-tema="escuro"] .logo-delas img{border-radius:10px}
.cabeca nav{flex:1 1 100%;order:3}
#cta{margin-left:auto}
#menu-bt{display:none}
@media (min-width:1000px){.cabeca nav{flex:1 1 auto;order:0}#cta{order:4}}
.sub{color:var(--tinta2);margin:8px 0 0;font-size:.95rem}
.beta{display:inline-block;margin-left:6px;font:700 .8rem/1.6 var(--fonte);border-radius:999px;padding:0 10px;background:var(--at-f);color:var(--at-t);border:1px solid var(--linha)}
nav.abas ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px 6px;margin:0;padding:0}
nav.abas a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border-radius:8px;color:var(--texto);text-decoration:none;
  font:600 1rem/1.2 var(--fonte);border-bottom:3px solid transparent}
nav.abas a[aria-current="page"]{border-bottom-color:var(--semente);color:var(--titulo-cor)}
nav.abas a.delas[aria-current="page"]{border-bottom-color:var(--delas)}
h2{font:400 clamp(1.5rem,3.6vw,2rem)/1.2 var(--titulo);letter-spacing:.02em;color:var(--titulo-cor);margin:0 0 10px}
h3{font:700 1.08rem/1.3 var(--fonte);margin:0 0 6px}
main section{margin:20px 0}
main h2::before{content:"";display:block;width:40px;height:3px;background:var(--terracota);margin:0 0 8px}
.hero{padding:22px 0 8px}
.sobrancelha{font:700 1rem/1.4 var(--fonte);color:var(--sobrancelha);margin:0 0 10px}
.hero h2{font-size:clamp(1.8rem,5vw,2.9rem);max-width:22ch}
.hero p.chamada{max-width:60ch;font-size:1.1rem}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:16px}
.cartao.marca{border-top:4px solid var(--semente)}
.cartao.delas{border-top:4px solid var(--delas);background:var(--delas-f)}
.cartao.delas h2,.cartao.delas h3{color:var(--delas-t)}
.logo-delas img{height:120px;width:auto;display:block;margin:0 0 10px}
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.botao{display:inline-flex;align-items:center;justify-content:center;font:700 1rem/1.2 var(--fonte);min-height:44px;padding:6px 18px;border-radius:8px;
  border:2px solid var(--acao);background:var(--acao);color:var(--sobre-acao);cursor:pointer;text-decoration:none;text-align:center}
.botao.sec{background:transparent;color:var(--sec);border-color:var(--sec)}
.botao.delas{background:var(--delas);border-color:var(--delas);color:var(--sobre-delas)}
.botao[disabled]{opacity:.6;cursor:wait}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.selo{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:700;border:1px solid var(--linha);white-space:nowrap}
.selo.ok{background:var(--ok-f);color:var(--ok-t)}
.selo.dev{background:var(--at-f);color:var(--at-t)}
.faixa{border-radius:12px;padding:12px 16px;font-weight:600;border:1px solid var(--linha);border-left:6px solid var(--terracota);background:var(--at-f);color:var(--at-t)}
.faixa.erro{background:var(--al-f);color:var(--al-t)}
.nota-delas{border-left:6px solid var(--delas);background:var(--delas-f);color:var(--texto);border-radius:8px;padding:10px 14px;margin:10px 0 0}
.progresso p{margin:0 0 6px;font:700 .95rem/1.4 var(--fonte)}
.barra{height:10px;border-radius:999px;background:var(--suave);border:1px solid var(--borda-campo);overflow:hidden}
.barra span{display:block;height:100%;background:var(--semente);width:50%}
.barra span.p2{width:100%}
.t2{color:var(--tinta2)}
.pq{font-size:.9rem}
.rolagem{overflow-x:auto;border:1px solid var(--linha);border-radius:12px;background:var(--sup)}
table{border-collapse:collapse;width:100%}
caption{text-align:left;padding:10px 12px 0;color:var(--tinta2);font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
thead th{background:var(--suave)}
ul.lista,ol.lista{margin:6px 0 0;padding-left:20px}
ul.pilulas{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
label{font-weight:600;display:block;margin-top:10px}
input[type=text],input[type=email],input[type=password],select,textarea{font:inherit;min-height:44px;padding:6px 10px;border:1px solid var(--borda-campo);
  border-radius:8px;background:var(--campo);color:var(--texto);width:100%}
textarea{min-height:110px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--acao);vertical-align:-4px;margin-right:6px}
.opcao{font-weight:400;display:block;margin-top:8px}
.campos{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
fieldset{border:1px solid var(--linha);border-radius:12px;padding:10px 14px;margin:12px 0 0}
legend{font-weight:700;padding:0 6px}
.msg{min-height:1.4em;font-weight:600;margin:8px 0 0}
.msg.erro{color:var(--erro-msg);border-left:4px solid var(--terracota);padding-left:8px}
.item{border-top:1px solid var(--linha);padding:10px 0}
.item:first-child{border-top:0}
.item p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.juridico h3{margin-top:14px}
footer{border-top:3px solid var(--terracota);margin-top:28px;padding:16px 0 28px;color:var(--sobre-faixa);font-size:.92rem;background:var(--rodape)}
footer a{color:var(--sobre-faixa)}
footer ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0;margin:6px 0 0}
footer a{display:inline-flex;align-items:center;min-height:44px}
@media (max-width:760px){#menu-bt{display:inline-flex;margin-left:auto}#cta{margin-left:0}#abas{display:none}#abas.aberto{display:block}#abas ul{flex-direction:column}h1.logo img{height:56px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>

async function pedir(rota, corpo) {
  const op = { headers: { "Content-Type": "application/json" }, credentials: "same-origin" };
  if (corpo !== undefined) { op.method = "POST"; op.body = JSON.stringify(corpo); if (inst && inst.csrf) op.headers["X-Physis-CSRF"] = inst.csrf; }
  const r = await fetch(rota, op);
  let j = {}; try { j = await r.json(); } catch (e) {}
  j._status = r.status;
  return j;
}

function aplicarIdioma() {
  document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.getAttribute("data-t")); if (typeof v === "string") el.textContent = v; });
  document.title = t("titulo") + " · " + t("abas")[aba];
  $("abas").setAttribute("aria-label", t("nav"));
  document.querySelectorAll("h1.logo img").forEach(im => im.alt = t("logo_alt"));
  $("endosso").innerHTML = `<span>${esc(t("endosso_a"))}</span> <span class="marca-physis">Physis</span>${t("endosso_b") ? " <span>" + esc(t("endosso_b")) + "</span>" : ""}`;
}

function desenharAbas() {
  $("abas").innerHTML = "<ul>" + MENU.map(a => `<li><a href="#${a}"${a === "delas" ? ' class="delas"' : ""}${a === aba ? ' aria-current="page"' : ""}>${esc(t("abas")[a])}</a></li>`).join("") + "</ul>";
  if (aba === "inicio") $("logo-link").setAttribute("aria-current", "page"); else $("logo-link").removeAttribute("aria-current");
  if (aba === "participar") $("cta").setAttribute("aria-current", "page"); else $("cta").removeAttribute("aria-current");
}

       : cat === "hackathon" ? t("hac_forum") : t("for_cats")[cat] || t("for_t");

async function forum(cat) {
  const alvo = $("forum");
  if (!alvo) return;
  const titulo = tituloForum(cat);
  const base = inst && inst.autenticado ? "/api/comunidade" : "/api/publico/comunidade";
  if (cat === "delas" && !(eu && (eu.equipe || (eu.participante && eu.participante.delas)))) {
    alvo.innerHTML = `<h2>${esc(titulo)}</h2><p>${esc(t("del_fechado"))}</p><div class="acoes"><a class="botao delas" href="#participar">${esc(t("abas").participar)}</a></div>`;
    return;
  }
  if (topicoAberto) {
    const j = await pedir(`${base}/forum/${topicoAberto}`);
    if (!j.ok) { topicoAberto = null; return forum(cat); }
    alvo.innerHTML = `<h2>${esc(j.topico.titulo)}</h2>` + j.mensagens.map(m => `<div class="item"><strong>${esc(m.autor_nome)}</strong> <span class="t2 pq">${esc(data(m.criado))}</span>
        ${m.estado !== "publicado" ? `<span class="selo dev">${esc(t("pendente"))}</span>` : ""}<p>${esc(m.texto)}</p></div>`).join("")
      + (eu && eu.pode_publicar ? `<form id="resp"><label for="resp-txt">${esc(t("resposta"))}</label><textarea id="resp-txt" maxlength="8000" required></textarea>

      + `<div class="acoes"><button class="botao sec" type="button" id="voltar">${esc(t("voltar"))}</button></div>`;

  alvo.innerHTML = `<h2>${esc(titulo)}</h2>` + (j.topicos.length ? j.topicos.map(x => `<div class="item"><h3>${esc(x.titulo)}</h3>
      <span class="t2 pq">${esc(x.autor_nome)} · ${esc(data(x.criado))} · ${+x.mensagens} ${esc(t("mensagens"))}</span>

      <div class="acoes"><button class="botao sec" type="button" data-topico="${+x.id}">${esc(t("ver"))}</button></div></div>`).join("") : `<p>${esc(t("forum_vazio"))}</p>`)
    + (eu && eu.pode_publicar ? `<form id="novo"><h3>${esc(t("publicar_t"))}</h3><label for="novo-tit">${esc(t("publicar_tit"))}</label><input type="text" id="novo-tit" maxlength="160" required>

      : `<p class="t2">${esc(t("publicar_login"))} <a href="#participar">${esc(t("abas").participar)}</a></p>`);

    $("novo-msg").textContent = r.ok ? (r.aviso || t("publicar_ok")) : (r.erro || t("sem_hub")); $("novo-msg").className = "msg" + (r.ok ? "" : " erro"); if (r.ok) setTimeout(() => forum(cat), 1200); };

async function moderacao() {

  const j = await pedir("/api/comunidade/moderacao");
  if (!j.ok) { alvo.innerHTML = `<h2>${esc(t("eq_mod_t"))}</h2><p class="faixa erro">${esc(j.erro || t("sem_hub"))}</p>`; return; }
  alvo.innerHTML = `<h2>${esc(t("eq_mod_t"))}</h2>` + (j.itens.length ? j.itens.map((x, i) => `<div class="item"><h3>${esc(t("eq_mod_tipos")[x.tipo] || x.tipo)}: ${esc(x.titulo || x.nome_publico || "")}</h3>
      <span class="t2 pq">${esc(x.autor_nome || x.responsavel_nome || "")}${x.responsavel_email ? " · " + esc(x.responsavel_email) : ""}${x.categoria ? " · " + esc(x.categoria) : ""}</span>
      ${x.texto ? `<p>${esc(x.texto)}</p>` : ""}
      <label for="mot-${i}">${esc(t("eq_motivo"))}</label><input type="text" id="mot-${i}" maxlength="400">
      <div class="acoes"><button class="botao" type="button" data-mod="${i}" data-dec="aprovar">${esc(t("eq_aprovar"))}</button>
      <button class="botao sec" type="button" data-mod="${i}" data-dec="recusar">${esc(t("eq_recusar"))}</button></div><p class="msg" id="mod-msg-${i}" role="status"></p></div>`).join("")
      : `<p>${esc(t("eq_mod_vazio"))}</p>`);
  alvo.querySelectorAll("[data-mod]").forEach(b => b.onclick = async () => {
    const i = +b.getAttribute("data-mod"), x = j.itens[i];
    const r = await pedir("/api/comunidade/moderar", { tipo: x.tipo, id: x.id, decisao: b.getAttribute("data-dec"), motivo: $("mot-" + i).value });
    if (r.ok) moderacao(); else { $("mod-msg-" + i).textContent = r.erro || t("sem_hub"); $("mod-msg-" + i).className = "msg erro"; }
  });
}

async function interesses() {
  const alvo = $("interesses");
  if (!alvo) return;
  const j = await pedir("/api/inovastem/interesses");
  if (!j.ok) { alvo.innerHTML = `<h2>${esc(t("eq_int_t"))}</h2><p class="faixa erro">${esc(j.erro || t("sem_hub"))}</p>`; return; }
  alvo.innerHTML = `<h2>${esc(t("eq_int_t"))}</h2><p>${esc(t("eq_int_total"))}: <strong>${+j.total}</strong></p>
    <div class="rolagem"><table><caption>${esc(t("int_areas"))}</caption><tbody>${Object.keys(j.por_area).map(k => `<tr><th scope="row">${esc(nomeArea(k))}</th><td>${+j.por_area[k]}</td></tr>`).join("")}</tbody></table></div>
    <div class="acoes"><button class="botao sec" type="button" id="int-csv">${esc(t("eq_int_baixar"))}</button></div><p class="t2 pq">${esc(t("eq_int_aviso"))}</p>`;
  $("int-csv").onclick = () => {
    const cols = ["id", "nome", "email", "areas", "cidade", "instituicao", "quero_delas", "maior", "responsavel_nome", "responsavel_email", "versao_aviso", "criado"];
    const cel = v => { let s = Array.isArray(v) ? v.join("|") : String(v == null ? "" : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const csv = [cols.join(";")].concat(j.itens.map(x => cols.map(c => cel(c === "criado" ? new Date(x.criado * 1000).toISOString() : x[c])).join(";"))).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = "inovastem-interesses.csv"; document.body.appendChild(a); a.click(); a.remove();

async function compartilhar() {

    if (navigator.share) { await navigator.share({ title: "InovaSTEM", text: t("compartilhar_txt"), url }); return; }
    await navigator.clipboard.writeText(url);
    const m = $("comp-msg"); if (m) m.textContent = t("compartilhado");
  } catch (e) {}
}

function ligar() {
  document.querySelectorAll("[data-compartilhar]").forEach(b => b.onclick = compartilhar);
  if (CAT_DA_ABA[aba]) forum(CAT_DA_ABA[aba]);
  if (aba === "forum") {
    forum(catForum);
    document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { catForum = b.getAttribute("data-cat"); topicoAberto = null;
      document.querySelectorAll("[data-cat]").forEach(o => { const sim = o.getAttribute("data-cat") === catForum;
        o.className = "botao" + (sim ? "" : " sec"); o.setAttribute("aria-pressed", String(sim)); }); forum(catForum); });
  }
  if (aba === "modelagem") biblioteca();
  if (aba === "hackathon") $("hac-interesse").onclick = () => { areaPre = "hackathon"; location.hash = "#participar"; };
  if (aba === "desafios") {
    propostas();
    const f = $("sug");
    f.onsubmit = async ev => {
      ev.preventDefault();
      const r = await pedir("/api/publico/inovastem/projeto", { titulo: $("sug-tit").value, descricao: $("sug-desc").value, area: $("sug-area").value,
        organizacao: $("sug-org").value, nome: $("sug-nome").value, email: $("sug-email").value, aceite: $("sug-aceite").checked });
      $("sug-msg").textContent = r.ok ? t("sug_ok") : (r.erro || t("sem_hub")); $("sug-msg").className = "msg" + (r.ok ? "" : " erro");
      if (r.ok) f.reset();
    };
    const fd = $("des-f");
    if (fd) fd.onsubmit = async ev => {
      ev.preventDefault();
      const r = await pedir("/api/inovastem/desafio", { titulo: $("des-tit").value, descricao: $("des-desc").value, area: $("des-area").value,
        organizacao: $("des-org").value, prazo: $("des-prazo").value });
      $("des-msg").textContent = r.ok ? "✓" : (r.erro || t("sem_hub")); $("des-msg").className = "msg" + (r.ok ? "" : " erro");
      if (r.ok) { fd.reset(); propostas(); }
    };
  }
  if (aba === "participar") {
    moderacao(); filaIno(); interesses();
    const fi = $("int");
    const irPasso = n => {
      passoInt = n;
      $("int-p1").hidden = n !== 1; $("int-p2").hidden = n !== 2;
      $("int-barra").className = n === 2 ? "p2" : ""; $("int-prog").setAttribute("aria-valuenow", String(n));
      $("int-passo-txt").textContent = t("passo").replace("{n}", n);
      (n === 2 ? fi.querySelector('input[name="int-idade"]') : $("int-nome")).focus();
    };
    $("int-seguir").onclick = () => {
      const ok = $("int-nome").value.trim().length >= 2 && /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test($("int-email").value.trim());
      $("int-msg").textContent = ok ? "" : t("passo1_falta"); $("int-msg").className = "msg" + (ok ? "" : " erro");
      if (ok) irPasso(2); else (($("int-nome").value.trim().length < 2) ? $("int-nome") : $("int-email")).focus();
    };
    $("int-voltar").onclick = () => irPasso(1);
    fi.querySelectorAll('input[name="int-idade"]').forEach(r => r.onchange = () => { $("int-resp").hidden = fi.querySelector('input[name="int-idade"]:checked').value !== "menor"; });
    $("int-genero").onchange = () => { $("int-delas").hidden = $("int-genero").value !== "feminino"; };
    fi.onsubmit = async ev => {
      ev.preventDefault();
      const maior = fi.querySelector('input[name="int-idade"]:checked').value === "maior";
      const corpo = { nome: $("int-nome").value, email: $("int-email").value, areas: [...fi.querySelectorAll('input[name="area"]:checked')].map(x => x.value),
                      cidade: $("int-cidade").value, instituicao: $("int-inst").value, genero: $("int-genero").value,
                      quero_delas: $("int-genero").value === "feminino" && $("int-delas-quero").checked, maior_de_idade: maior,
                      aceite: $("int-aceite").checked, versao: (ino && ino.versao_aviso) || "" };
      if (!maior) { corpo.responsavel_nome = $("int-resp-nome").value; corpo.responsavel_email = $("int-resp-email").value; }
      const r = await pedir("/api/publico/inovastem/interesse", corpo);
      $("int-msg").textContent = r.ok ? t("int_ok") + (r.delas ? t("int_ok_delas") : "") : (r.erro || t("sem_hub"));
      $("int-msg").className = "msg" + (r.ok ? "" : " erro");
      if (r.ok) { fi.reset(); $("int-resp").hidden = true; $("int-delas").hidden = true; areaPre = ""; irPasso(1); $("int-msg").textContent = t("int_ok") + (r.delas ? t("int_ok_delas") : ""); }
    };
    const f = $("cad");
    if (f) {
      f.querySelectorAll('input[name="idade"]').forEach(r => r.onchange = () => { $("cad-resp").hidden = f.querySelector('input[name="idade"]:checked').value !== "menor"; });
      f.onsubmit = async ev => {
        ev.preventDefault();
        const maior = f.querySelector('input[name="idade"]:checked').value === "maior";
        const corpo = { nome: $("cad-nome").value, usuario: $("cad-email").value, senha: $("cad-senha").value, nome_publico: $("cad-pub").value,
                        maior_de_idade: maior, delas: $("cad-delas").checked, consentimento: { aceito: $("cad-aceite").checked, versao: (ino && ino.versao_aviso) || "1" } };
        if (!maior) { corpo.responsavel_nome = $("cad-resp-nome").value; corpo.responsavel_email = $("cad-resp-email").value; }
        const r = await pedir("/api/publico/cadastro", corpo);
        $("cad-msg").textContent = r.ok ? t("cad_ok") + (r.pode_publicar ? "" : " " + t("int_menor_aviso")) : (r.erro || t("sem_hub"));
        $("cad-msg").className = "msg" + (r.ok ? "" : " erro");
        if (r.ok) { f.reset(); $("cad-resp").hidden = true; }
      };
    }
    const ds = $("eu-delas-salvar");
    if (ds) ds.onclick = async () => { const r = await pedir("/api/comunidade/delas", { autodeclaro: $("eu-delas").checked });
      $("eu-msg").textContent = r.ok ? "✓" : (r.erro || t("sem_hub")); if (r.ok) await carregarEu(); };
    const sa = $("eu-sair");
    if (sa) sa.onclick = async () => { if (!confirm(t("eu_sair_aviso"))) return; const r = await pedir("/api/comunidade/sair", {});
      $("eu-msg").textContent = r.ok ? "✓" : (r.erro || t("sem_hub")); await carregarEu(); desenhar(); };
    const fe = $("ent-f");
    if (fe) fe.onsubmit = async ev => {
      ev.preventDefault();
      const r = await pedir("/api/conta/entrar", { usuario: $("ent-usuario").value, senha: $("ent-senha").value });
      if (!r.ok) { $("ent-msg").textContent = r._status === 429 ? (r.erro || t("sem_hub")) : t("ent_erro"); $("ent-msg").className = "msg erro"; return; }
      inst = await pedir("/api/instancia"); await carregarEu(); desenhar();
    };
    const sc = $("sair-conta");
    if (sc) sc.onclick = async () => { await pedir("/api/conta/sair", {}); inst = await pedir("/api/instancia"); await carregarEu(); desenhar(); };
    const rm = $("rem");
    if (rm) rm.onsubmit = async ev => { ev.preventDefault(); const r = await pedir("/api/inovastem/remover", { email: $("rem-email").value });
      $("rem-msg").textContent = r.ok ? t("eq_rem_ok").replace("{i}", r.interesses).replace("{p}", r.propostas) : (r.erro || t("sem_hub"));
      $("rem-msg").className = "msg" + (r.ok ? "" : " erro"); if (r.ok) { rm.reset(); interesses(); } };
  }
}

async function carregarEu() {
  eu = null;
  if (inst && inst.autenticado) { const j = await pedir("/api/comunidade/eu"); if (j.ok) eu = j; }
}

function irPara() {
  const h = (location.hash || "#inicio").slice(1);
  $("abas").classList.remove("aberto"); $("menu-bt").setAttribute("aria-expanded", "false");
  aba = ABAS.includes(h) || EXTRAS.includes(h) ? h : "inicio";
  topicoAberto = null;
  desenhar();
  if (h && h !== "inicio") { const c = $("conteudo"); if (c) c.focus({ preventScroll: true }); }
}

async function iniciar() {
  aplicarIdioma(); desenharAbas(); rodape();
  $("estado").textContent = t("carregando");
  try { inst = await pedir("/api/instancia"); } catch (e) { inst = null; }
  try { const j = await pedir("/api/publico/inovastem"); ino = j.ok ? j : null; } catch (e) { ino = null; }
  $("estado").textContent = inst ? "" : t("sem_hub");
  await carregarEu();
  window.addEventListener("hashchange", irPara);
  $("menu-bt").onclick = () => { const abrir = !$("abas").classList.contains("aberto");
    $("abas").classList.toggle("aberto", abrir); $("menu-bt").setAttribute("aria-expanded", String(abrir));
    if (abrir) { const a = $("abas").querySelector("a"); if (a) a.focus(); } };
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("abas").classList.contains("aberto")) {
    $("abas").classList.remove("aberto"); $("menu-bt").setAttribute("aria-expanded", "false"); $("menu-bt").focus(); } });
  irPara();
}
iniciar();

<script id="physis-preferencias">
/* physis-preferencias.js v3 · Preferências de leitura e acessibilidade das telas da Physis
   Barra com 4 controles: [Idioma: Português/English] [Tema: Claro/Escuro/Automático] [Modo de conforto ▾] [Acessibilidade (PcD) ▾].
   Modo de conforto (neurodivergência: autismo, TDAH, dislexia): fundo verde, texto maior, mais espaçamento, menos estímulo,
   foco reforçado, fonte para dislexia, régua de leitura, leitura simplificada, lembrar onde parei.
   Acessibilidade (PcD): cegueira e baixa visão (leitores de tela, ouvir esta tela, alto contraste, zoom, atalhos),
   surdez (alertas visuais, Libras, legendas), fala (comunicação alternativa · CAA), mobilidade (teclado, comandos de voz).

   ORIGINAL ÚNICO: sistema/physis-preferencias.js (desde a v3 a antiga barra px-preferencias da plataforma, da Gestão e do
   SCADA é esta mesma, pela porta PxPref, no fim do arquivo). As telas são arquivos únicos, então cada uma leva uma CÓPIA IGUAL
   dentro do bloco script de id "physis-preferencias" (o arquivo inteiro, sem mudar nada). Quem copia é ferramentas/sincronizar.py
   (BLOCOS): physis-hub/web/painel.html, sistema/gestao-interna-physis.html, sistema/physis-scada-demo.html,
   physis-hub/web/consultoria.html, sistema/SustainKit_Definitivo.html, modulos/planejador/planejador-physis.html (e as demos
   geradas delas). O teste physis-hub/tests/test_preferencias.py confere que as cópias são iguais a este arquivo.

   Uso, uma vez por página, depois do conteúdo:
     PhysisPreferencias.iniciar({
       chave: "physis-pref",              // guardado no navegador; a mesma chave em todas as telas = a escolha acompanha a pessoa
       dicionario: { "Texto em português": "English text" },
       padroes: [[/^Pedido (\S+) recebido\.$/, "Request $1 received."]],   // textos montados na hora
       fragmentos: { "Captação de": "Harvesting of" },  // pedaços de textos montados com números ("Captação de " + n + " L")
       excecoes: ["Physis Engineering"],  // nomes próprios: iguais nas duas línguas
       ondeColocar: "#pp-lugar",          // elemento ou seletor onde a barra aparece (sem ele: início do <body>)
       variante: "sobre-verde",           // opcional: barra sobre fundo verde-escuro
       escalaPorZoom: true,               // texto maior por zoom (telas em px); false = a página usa var(--pp-escala)
       conteudo: "#conteudo",             // Alt+1, "Pular para o conteúdo" e "Ouvir esta tela"
       menu: "nav",                       // Alt+2
       busca: "[role=tablist]",           // Alt+3
       contato: "#f-desc",                // campo onde a CAA escreve quando nenhum campo está em uso
       relatar: "#contato",               // "Relatar barreira" sem abrirJuridico(): link do contato
       lembrar: { salvar: function () { return {}; }, restaurar: function (o) {} },  // opcional: aba aberta etc.
       esconderEmQuadro: true,            // aberta num quadro (iframe) da plataforma ou com html[data-em-quadro]: sem barra própria, segue a escolha de lá
       idiomaExterno: { atual, definir }, // tela que se traduz sozinha (o módulo só pede a troca; não traduz o DOM)
       suporte: function (frase) {},      // CAA sem campo em uso: leva a frase ao suporte da tela
       tela: "nome",                      // chave do "lembrar onde parei" (padrão: o endereço)
       aoMudar: function (estado) {}      // chamado depois de cada mudança
     });

   No <html>: data-tema="claro|escuro" (o que vale), data-tema-escolha="claro|escuro|auto", lang, a variável --pp-escala
   (1, 1.15 ou 1.3) e as classes physis-conforto, a11y-verde, a11y-texto-1 / a11y-texto-2, a11y-espaco, a11y-calma,
   a11y-foco, a11y-dislexia, a11y-regua, a11y-simples, a11y-contraste.
   Cada página define as próprias cores em html[data-tema="escuro"] e html.a11y-verde (os nomes das variáveis mudam de
