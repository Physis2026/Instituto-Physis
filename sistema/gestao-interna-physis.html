<style>
  html,body{margin:0;padding:0;background:#F4F6F1;-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  #carregando{min-height:100vh;display:grid;place-items:center;color:#1C2B21;opacity:.9;font-size:15px}
</style>
<style>
/* ===== Padrão Physis · camada comum (não editar por app) ===== */
:root{--px-fundo:#F4F6F1;--px-sup:#FFFFFF;--px-tinta:#1C2B21;--px-fraca:#4A4F44;--px-marca:#4B7547;
  --px-acao:#33512F;--px-linha:#C9D2C4;--px-atencao:#8A6410;--px-alerta:#A63A28;--px-info:#2C5A6E}
.px-pular{position:absolute;left:12px;top:-80px;z-index:1000;background:var(--px-tinta);color:#fff;
  padding:12px 16px;border-radius:6px;font-weight:700;text-decoration:none}
.px-pular:focus{top:12px}
:focus-visible{outline:3px solid var(--px-acao)!important;outline-offset:2px!important}
.px-faixa{background:#F4F6F1;border-bottom:1px solid var(--px-linha);color:var(--px-tinta);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
.px-faixa .px-in{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:space-between;gap:10px 16px}
.px-faixa .px-id{display:flex;align-items:center;gap:14px}
.px-faixa img{height:44px;width:auto;display:block}
.px-faixa .px-tit{font-weight:700;font-size:1.2em;color:var(--px-marca);padding-left:14px;
  border-left:1px solid var(--px-linha)}
.px-faixa nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.px-faixa a.px-l,.px-faixa button.px-b{font:inherit;font-size:.92em;min-height:44px;display:inline-flex;
  align-items:center;padding:0 14px;border-radius:6px;text-decoration:none;cursor:pointer;
  border:1px solid var(--px-linha);background:#fff;color:var(--px-tinta)}
.px-faixa a.px-l[aria-current="page"]{background:var(--px-tinta);border-color:var(--px-tinta);color:#fff;font-weight:600}
.px-faixa button.px-b{border-color:var(--px-acao);color:var(--px-acao);font-weight:600}
.px-faixa button.px-b[aria-pressed="true"]{background:var(--px-acao);color:#fff}
html.px-conforto body{font-size:115%!important;line-height:1.6!important;letter-spacing:.01em}
html.px-conforto body, html.px-conforto body *:not(code):not(pre):not(svg *):not(.px-faixa img){
  font-family:"Atkinson Hyperlegible",Verdana,Tahoma,sans-serif!important}
html.px-conforto *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      grandezasEn: "Active and reactive energy, demand, power factor, in 15-minute intervals",
      instrumento: "Medidor de energia classe 1 com registro", instrumentoEn: "Class 1 recording energy meter",
      duracao: "Permanente. É a linha de base de tudo", duracaoEn: "Permanent. It is the baseline for everything",
      revela: "Fecha a reconciliação com a fatura e denuncia ultrapassagem de demanda e excedente reativo",
      revelaEn: "Closes the reconciliation with the bill and exposes demand overrun and reactive excess"
    },
    agua: {
      onde: "Na entrada geral e no maior uso individual",
      ondeEn: "At the main inlet and at the single largest use",
      grandezas: "Volume acumulado e vazão instantânea",
      grandezasEn: "Accumulated volume and instantaneous flow",
      instrumento: "Hidrômetro com saída de pulso, ou medidor ultrassônico não invasivo",
      instrumentoEn: "Water meter with pulse output, or non-invasive ultrasonic meter",
      duracao: "Permanente na entrada; uma semana no uso individual",
      duracaoEn: "Permanent at the inlet; one week at the individual use",
      revela: "Consumo fora do horário de produção, que é vazamento até prova em contrário",
      revelaEn: "Consumption outside production hours, which is leakage until proven otherwise"
    },
    combustivel: {
      onde: "No tanque e no queimador, ou horímetro no equipamento",
      ondeEn: "At the tank and the burner, or an hour meter on the equipment",
      grandezas: "Volume ou massa consumida, horas de operação",
      grandezasEn: "Volume or mass consumed, operating hours",
      instrumento: "Medidor de vazão de combustível, régua ou balança, horímetro",
      instrumentoEn: "Fuel flow meter, dip gauge or scale, hour meter",
      duracao: "Um mês, cruzado com as notas de compra",
      duracaoEn: "One month, cross-checked against purchase invoices",
      revela: "Diferença entre o que foi comprado e o que foi queimado",
      revelaEn: "The gap between what was purchased and what was burned"
    },
    efluente: {
      onde: "Na saída da estação de tratamento", ondeEn: "At the treatment plant outlet",
      grandezas: "Vazão acumulada", grandezasEn: "Accumulated flow",
      instrumento: "Medidor de vazão em canal aberto ou eletromagnético",
      instrumentoEn: "Open channel or electromagnetic flow meter",
      duracao: "Permanente, se houver outorga de lançamento",
      duracaoEn: "Permanent, if there is a discharge permit",
      revela: "Balanço hídrico: o que entra e não sai virou produto, perda ou vazamento",
      revelaEn: "Water balance: what comes in and does not leave became product, loss or leakage"
    },
    geracao: {
      onde: "Na saída do inversor e no ponto de conexão", ondeEn: "At the inverter output and the connection point",
      grandezas: "Energia gerada, energia injetada, irradiância se houver solar",
      grandezasEn: "Generated energy, exported energy, irradiance if solar",
      instrumento: "Medidor bidirecional e piranômetro", instrumentoEn: "Bidirectional meter and pyranometer",
      duracao: "Permanente", duracaoEn: "Permanent",
      revela: "Desempenho real contra o prometido na proposta, e o custo de disponibilidade que não zera",
      revelaEn: "Real performance versus what the proposal promised, and the availability charge that never zeroes"
    }
  };

  /* Calibração vence. E vencida, o dado vira opinião. */
  function statusCalibracao(validade, referencia) {
    if (!validade) return { estado: "sem_calibracao", dias: null };
    var v = new Date(String(validade).slice(0, 10) + "T00:00:00Z");
    if (isNaN(v.getTime())) return { estado: "data_invalida", dias: null };
    var r = referencia ? new Date(String(referencia).slice(0, 10) + "T00:00:00Z") : new Date();
    var dias = Math.round((v - r) / 86400000);
    var estado = dias < 0 ? "vencida" : (dias <= 60 ? "vence_em_breve" : "valida");
    return { estado: estado, dias: dias };
  }

  /* A regra que decide se vale ir a campo: a incerteza tem que ser bem menor
     que a economia que se pretende comprovar. Razão de 3 para 1 é o mínimo
     defensável; abaixo de 1 para 1 a medição não distingue economia de ruído. */
  function economiaComprovavel(economiaPct, incertezaPct) {
    var e = num(economiaPct), i = num(incertezaPct);
    if (!isFinite(e) || e <= 0) return { ok: null, razao: null, veredito: "falta_economia" };
    if (!isFinite(i) || i < 0) return { ok: null, razao: null, veredito: "falta_incerteza" };
    if (i === 0) return { ok: true, razao: Infinity, veredito: "confortavel" };
    var razao = e / i;
    var veredito = razao >= 3 ? "confortavel" : (razao >= 1 ? "apertado" : "nao_comprova");
    return { ok: razao >= 3, razao: razao, veredito: veredito };
  }

  function validarInstrumento(inst) {
    var e = [];
    inst = inst || {};
    if (!String(inst.nome || "").trim()) e.push("nome_ausente");
    if (!String(inst.grandeza || "").trim()) e.push("grandeza_ausente");
    var exa = num(inst.exatidao);
    if (!isFinite(exa) || exa <= 0) e.push("exatidao_ausente");
    if (!String(inst.laboratorio || "").trim()) e.push("laboratorio_ausente");
    if (!String(inst.certificado || "").trim()) e.push("certificado_ausente");
    var st = statusCalibracao(inst.validade, inst.referencia);
    if (st.estado === "sem_calibracao") e.push("validade_ausente");
    if (st.estado === "data_invalida") e.push("validade_invalida");
    if (st.estado === "vencida") e.push("calibracao_vencida");
    return e;
  }

  /* Monta o plano de medição a partir do inventário que a pessoa já preencheu. */
  function planoMedicao(dados) {
    dados = dados || {};
    var pontos = [{ chave: "entrada", ref: PONTOS_UTILIDADE.entrada, alvo: "Entrada de energia", alvoEn: "Energy incomer" }];
    var tiposVistos = {};
    (dados.equipamentos || []).forEach(function (eq) {
      var tipo = PONTOS_MEDICAO[eq.tipo] ? eq.tipo : "outro";
      var chave = tipo + ":" + (eq.nome || "");
      if (tiposVistos[chave]) return;
      tiposVistos[chave] = true;
      pontos.push({ chave: chave, ref: PONTOS_MEDICAO[tipo], alvo: eq.nome || tipo, alvoEn: eq.nome || tipo,
                    kwh_ano: equipamento(eq).kwh_ano });
    });
    if (isFinite(num(dados.agua_m3_ano))) pontos.push({ chave: "agua", ref: PONTOS_UTILIDADE.agua, alvo: "Água", alvoEn: "Water" });
    if (["diesel_l_ano", "glp_kg_ano", "gn_m3_ano"].some(function (k) { return isFinite(num(dados[k])); }))
      pontos.push({ chave: "combustivel", ref: PONTOS_UTILIDADE.combustivel, alvo: "Combustível", alvoEn: "Fuel" });
    if (isFinite(num(dados.efluente_m3_ano))) pontos.push({ chave: "efluente", ref: PONTOS_UTILIDADE.efluente, alvo: "Efluente", alvoEn: "Effluent" });
    if (isFinite(num(dados.geracao_kwh_ano))) pontos.push({ chave: "geracao", ref: PONTOS_UTILIDADE.geracao, alvo: "Geração própria", alvoEn: "On-site generation" });
    // maior consumidor primeiro, depois de manter a entrada no topo
    var cabeca = pontos.shift();
    pontos.sort(function (a, b) {
      var x = isFinite(a.kwh_ano) ? a.kwh_ano : -1, y = isFinite(b.kwh_ano) ? b.kwh_ano : -1;
      return y - x;
    });
    pontos.unshift(cabeca);
    return pontos;
  }

  /* ------------------------------------------------------------------ *
   * 6. Indicadores — quem não pode ser calculado diz o que falta
   * ------------------------------------------------------------------ */
  var FATORES = { rede: 0.0289, diesel: 2.671, glp: 2.939, gn: 1.999 };

  function indicadores(d, fatores) {
    d = d || {}; fatores = Object.assign({}, FATORES, fatores || {});
    var prod = num(d.producao_ano), kwh = num(d.energia_kwh_ano), agua = num(d.agua_m3_ano);
    function razao(a, b, faltaA, faltaB) {
      var falta = [];
      if (!(isFinite(b) && b > 0)) falta.push(faltaB);
      if (!isFinite(a)) falta.push(faltaA);
      return falta.length ? { valor: null, falta: falta } : { valor: a / b, falta: [] };
    }
    var e1 = 0, temE1 = false;
    [["diesel_l_ano", "diesel"], ["glp_kg_ano", "glp"], ["gn_m3_ano", "gn"]].forEach(function (p) {
      var v = num(d[p[0]]);
      if (isFinite(v) && v > 0) { e1 += v * fatores[p[1]]; temE1 = true; }
    });
    var e2 = isFinite(kwh) ? (kwh / 1000) * fatores.rede : 0;
    return {
      intensidade_energetica: razao(kwh, prod, "energia_kwh_ano", "producao_ano"),
      intensidade_hidrica: razao(agua, prod, "agua_m3_ano", "producao_ano"),
      emissoes_tco2e_ano: (temE1 || isFinite(kwh))
        ? { valor: e1 / 1000 + e2, falta: [] }
        : { valor: null, falta: ["energia_kwh_ano", "combustivel"] },
      desvio_aterro_pct: (function () {
        var x = desvioAterro(d.residuos);
        return isFinite(x.pct) ? { valor: x.pct, falta: [] } : { valor: null, falta: ["fluxo"] };
      })(),
      fatores_usados: fatores
    };
  }

  /* ------------------------------------------------------------------ *
   * 7. Registro e validação
   * ------------------------------------------------------------------ */
  function registro(tabela, dados) {
    var erros = [];
    if (TABELAS.indexOf(tabela) < 0) erros.push("tabela_desconhecida:" + tabela);
    dados = Object.assign({}, dados || {});
    var org = normalizarOrg(dados.org_id);
    if (!org) erros.push("org_id_ausente");
    else if (!orgValido(org)) erros.push("org_id_invalido");
    dados.org_id = org;
    (OBRIGATORIOS[tabela] || []).forEach(function (campo) {
      var v = dados[campo];
      if (v === undefined || v === null || String(v).trim() === "") erros.push("campo_ausente:" + campo);
    });
    if (tabela === "fluxo") validarResiduo(dados).forEach(function (e) { erros.push("residuo:" + e); });
    if (tabela === "medicao" && dados.grandeza !== undefined && dados.valor !== undefined) {
      var v = num(dados.valor);
      if (!isFinite(v)) erros.push("valor_nao_numerico");
      else { dados.valor = v; dados.alarme = avaliarAlarme(dados.grandeza, v); }
    }
    if (!dados.ts) dados.ts = new Date().toISOString();
    return { ok: erros.length === 0, registro: dados, erros: erros };
  }

  /* ------------------------------------------------------------------ *
   * 8. Trilha de auditoria
   * ------------------------------------------------------------------ */
  function Trilha(limite) {
    this.linhas = []; this.limite = limite || 1000;
  }
  Trilha.prototype.registrar = function (usuario, tabela, campo, antes, depois) {
    if (String(antes === undefined || antes === null ? "" : antes) ===
      String(depois === undefined || depois === null ? "" : depois)) return false;
    this.linhas.unshift({
      ts: new Date().toISOString(), usuario: usuario || "—",
      tabela: tabela, campo: campo,
      antes: antes === undefined || antes === null ? "" : antes,
      depois: depois === undefined || depois === null ? "" : depois
    });
    if (this.linhas.length > this.limite) this.linhas.pop();
    return true;
  };
  Trilha.prototype.exportar = function () { return this.linhas.slice(); };

  /* ------------------------------------------------------------------ *
   * 9. Pacote de intercâmbio — o arquivo que atravessa os apps
   * ------------------------------------------------------------------ */
  function criarPacote(opcoes) {
    opcoes = opcoes || {};
    var org = normalizarOrg(opcoes.org_id);
    if (!orgValido(org)) throw new Error("pacote sem org_id válido");
    return {
      _formato: VERSAO,
      _gerado_em: new Date().toISOString(),
      _gerado_por: opcoes.usuario || "—",
      _app: opcoes.app || "desconhecido",
      org_id: org,
      tabelas: opcoes.tabelas || {},
      fluxo_residuo: opcoes.residuos || [],
      requisito: opcoes.requisitos || [],
      indicadores: opcoes.indicadores || null,
      trilha_auditoria: opcoes.trilha || []
    };
  }

  function lerPacote(entrada) {
    var j = entrada;
    if (typeof entrada === "string") {
      try { j = JSON.parse(entrada); } catch (e) { return { ok: false, erros: ["json_invalido"] }; }
    }
    if (!j || typeof j !== "object") return { ok: false, erros: ["pacote_vazio"] };
    var formato = j._formato || "";
    if (FORMATOS_ACEITOS.indexOf(formato) < 0) return { ok: false, erros: ["formato_desconhecido:" + formato] };
    var org = normalizarOrg(j.org_id || (j.tabelas && j.tabelas.organizacao && j.tabelas.organizacao.org_id));
    if (!orgValido(org)) return { ok: false, erros: ["org_id_ausente"] };
    var avisos = [];
    if (formato !== VERSAO) avisos.push("migrado_de:" + formato);
    // carimba org_id em tudo que veio sem
    var tabelas = j.tabelas || {};
    Object.keys(tabelas).forEach(function (t) {
      if (tabelas[t] && typeof tabelas[t] === "object" && !tabelas[t].org_id) {
        tabelas[t].org_id = org; avisos.push("org_id_carimbado:" + t);
      }
    });
    ["fluxo_residuo", "requisito", "trilha_auditoria"].forEach(function (chave) {
      (j[chave] || []).forEach(function (linha) {
        if (linha && typeof linha === "object" && !linha.org_id && chave !== "trilha_auditoria") {
          linha.org_id = org; avisos.push("org_id_carimbado:" + chave);
        }
      });
    });
    return {
      ok: true, erros: [], avisos: avisos, formato: formato, org_id: org,
      pacote: Object.assign({}, j, { _formato: VERSAO, org_id: org, tabelas: tabelas })
    };
  }

  /* ------------------------------------------------------------------ *
   * 10. Autoteste — a equipe roda isto antes de plugar
   * ------------------------------------------------------------------ */
  function verificar() {
    var falhas = [], total = 0;
    function checar(nome, cond) { total++; if (!cond) falhas.push(nome); }

    checar("18 tabelas canônicas", TABELAS.length === 18);
    checar("org_id normaliza acento e espaço", normalizarOrg(" Cliente Alfa 01 ") === "cliente-alfa-01");
    checar("org_id vazio é inválido", !orgValido(normalizarOrg("")));
    checar("tópico casa com a ponte",
      montarTopico("cliente-alfa-01", "energia", "quadro-geral") === "physis/cliente-alfa-01/energia/quadro-geral");
    checar("tópico volta inteiro",
      analisarTopico("physis/c1/energia/qg").grandeza === "energia");
    checar("tópico torto é rejeitado", analisarTopico("physis/c1/energia") === null);
    checar("número pt", num("1.234,56") === 1234.56);
    checar("número en", num("1,234.56", "en") === 1234.56);
    checar("fator não vira milhar", num("2,671") === 2.671);
    checar("alarme alto", avaliarAlarme("temperatura", 90) === "alto");
    checar("alarme sem faixa", avaliarAlarme("xpto", 1) === "sem_faixa");
    checar("resíduo sem MTR não passa",
      validarResiduo({ classe: "I", dest: "coproc", qtd: 1 }).indexOf("mtr_ausente") > -1);
    checar("classe I em coleta pública é barrada",
      validarResiduo({ classe: "I", dest: "publica", qtd: 1, mtr: "x" }).indexOf("classe_I_em_destinacao_proibida") > -1);
    checar("registro sem org_id falha", registro("medicao", { grandeza: "energia", valor: 1 }).ok === false);
    checar("registro com org_id passa", registro("medicao", { org_id: "c1", grandeza: "energia", valor: 1 }).ok === true);
    checar("indicador sem produção diz o que falta",
      indicadores({ energia_kwh_ano: 100 }).intensidade_energetica.falta.indexOf("producao_ano") > -1);
    checar("indicador calcula 80 kWh/t",
      Math.abs(indicadores({ energia_kwh_ano: 116000, producao_ano: 1450 }).intensidade_energetica.valor - 80) < 1e-9);
    checar("30 CV vira 22,065 kW de eixo",
      Math.abs(potenciaEixoKw({ potencia_cv: 30 }) - 22.065) < 1e-9);
    checar("carregamento aceita 65 e 0,65",
      Math.abs(equipamento({ tipo: "motor", potencia_cv: 30, fator_carga: 65, horas_ano: 1 }).fator_carga - 0.65) < 1e-9);
    checar("equipamento sem horas diz o que falta",
      equipamento({ tipo: "motor", potencia_cv: 30, fator_carga: 0.6 }).falta.indexOf("horas") > -1);
    checar("aquecimento resistivo não tem fator de potência",
      equipamento({ tipo: "resistivo", potencia_kw: 10, fator_carga: 1, horas_ano: 1 }).fp_efetivo === null);
    checar("motor folgado é apontado",
      equipamento({ tipo: "motor", potencia_cv: 30, fator_carga: 0.3, horas_ano: 1 }).alertas.indexOf("superdimensionado") > -1);
    checar("inventário que não fecha é apontado",
      reconciliarConsumo([{ tipo: "motor", potencia_kw: 10, fator_carga: 1, horas_ano: 1000 }], 100000).veredito === "inventario_incompleto");
    checar("calibração vencida é apontada",
      statusCalibracao("2026-01-01", "2026-09-01").estado === "vencida");
    checar("calibração perto do fim avisa antes",
      statusCalibracao("2026-10-15", "2026-09-01").estado === "vence_em_breve");
    checar("calibração longe é válida",
      statusCalibracao("2027-06-01", "2026-09-01").estado === "valida");
    checar("sem validade não há calibração",
      statusCalibracao("", "2026-09-01").estado === "sem_calibracao");
    checar("economia de 3% com incerteza de 5% não se comprova",
      economiaComprovavel(3, 5).veredito === "nao_comprova");
    checar("economia de 20% com incerteza de 2% é confortável",
      economiaComprovavel(20, 2).veredito === "confortavel");
    checar("razão entre 1 e 3 é apertada",
      economiaComprovavel(8, 4).veredito === "apertado");
    checar("instrumento sem certificado é apontado",
      validarInstrumento({ nome: "x", grandeza: "energia", exatidao: 1 }).indexOf("certificado_ausente") > -1);
    checar("plano de medição sempre começa pela entrada",
      planoMedicao({}).length === 1 && planoMedicao({}) [0].chave === "entrada");
    checar("plano ordena por maior consumo depois da entrada",
      (function () {
        var p = planoMedicao({ equipamentos: [
          { nome: "pequeno", tipo: "bomba", potencia_kw: 1, fator_carga: 1, horas_ano: 100 },
          { nome: "grande", tipo: "motor", potencia_kw: 100, fator_carga: 1, horas_ano: 8000 }] });
        return p[1].alvo === "grande";
      })());
    checar("pacote exige org_id", (function () {
      try { criarPacote({}); return false; } catch (e) { return true; }
    })());
    checar("lê o formato da tela do cliente",
      lerPacote({ _formato: "physis-tela-cliente/1", org_id: "c1", tabelas: {} }).ok === true);
    checar("rejeita formato estranho",
      lerPacote({ _formato: "outra-coisa/9", org_id: "c1" }).ok === false);
    return { ok: falhas.length === 0, total: total, falhas: falhas };
  }

  return {
    VERSAO: VERSAO, FORMATOS_ACEITOS: FORMATOS_ACEITOS, TABELAS: TABELAS,
    OBRIGATORIOS: OBRIGATORIOS, FAIXAS: FAIXAS, FATORES: FATORES,
    CLASSES: CLASSES, DESTINOS: DESTINOS,
    normalizarOrg: normalizarOrg, orgValido: orgValido, num: num,
    montarTopico: montarTopico, analisarTopico: analisarTopico, avaliarAlarme: avaliarAlarme,
    validarResiduo: validarResiduo, toneladasAno: toneladasAno, desvioAterro: desvioAterro,
    TIPOS_EQUIPAMENTO: TIPOS_EQUIPAMENTO, CV_PARA_KW: CV_PARA_KW,
    potenciaEixoKw: potenciaEixoKw, equipamento: equipamento,
    PONTOS_MEDICAO: PONTOS_MEDICAO, PONTOS_UTILIDADE: PONTOS_UTILIDADE,
    statusCalibracao: statusCalibracao, economiaComprovavel: economiaComprovavel,
    validarInstrumento: validarInstrumento, planoMedicao: planoMedicao,
    validarEquipamento: validarEquipamento, reconciliarConsumo: reconciliarConsumo,
    indicadores: indicadores, registro: registro, Trilha: Trilha,
    criarPacote: criarPacote, lerPacote: lerPacote, verificar: verificar
  };
});

</script>
<script>
/* physis-anexo-gestao.js
 *
 * Anexo do Gestão Physis. Não toca no aplicativo: lê e escreve a mesma chave
 * de localStorage que ele já usa, e acrescenta o que faltava — uma saída.
 *
 * O que o app guardava:  localStorage["gestao-physis:gestao-physis-v3"]
 *   { equipe: [{id, nome, lang, admin, papel, papelEn, sol}],
 *     tarefas: [{id, pessoa, h, depende, projeto, projetoEn, texto, textoEn}],
 *     feitas:  { idDaTarefa: "AAAA-MM-DD" } }
 *
 * O que o anexo faz: converte para pacote physis/1, com org_id, e lê de volta.
 */
(function () {
  "use strict";

  var CHAVE = "gestao-physis:gestao-physis-v3";
  var ORG = "physis";
  var N = window.PhysisNucleo;
  var EN = /^en/i.test(navigator.language || "pt");

  var T = EN ? {
    exportar: "Back up", abrir: "Restore", planilha: "Spreadsheet",
    titulo: "Physis data",
    vazio: "Nothing stored yet. Use the app first, then back up.",
    okExport: function (n) { return "File saved. " + n + " record(s)."; },
    okImport: function (n) { return n + " record(s) restored. Reloading."; },
    erro: "File not recognised. Use a file this button produced.",
    juntar: "Merge", substituir: "Replace everything", cancelar: "Cancel",
    escolha: function (n) { return "This browser already holds " + n + " task(s). Merge keeps what is here and adds what is new."; },
    okJuntar: function (a, j) { return a + " added, " + j + " already here. Reloading."; },
    confirmaSub: "Replace everything currently in this browser?",
    aviso: "Data lives only in this browser. Back up before clearing history or changing phone.",
    copiaNunca: "No back up has ever been made on this device.",
    copiaEm: function (q, d) { return d === 0 ? "Last back up: today." : "Last back up: " + q + ", " + d + " day(s) ago."; },
    copiaAtrasada: "Over a week. Back up now."
  } : {
    exportar: "Fazer cópia", abrir: "Restaurar", planilha: "Planilha",
    titulo: "Dados da Physis",
    vazio: "Ainda não há nada guardado. Use o aplicativo e depois faça a cópia.",
    okExport: function (n) { return "Arquivo salvo. " + n + " registro(s)."; },
    okImport: function (n) { return n + " registro(s) restaurado(s). Recarregando."; },
    erro: "Arquivo não reconhecido. Use um arquivo gerado por este botão.",
    juntar: "Juntar", substituir: "Substituir tudo", cancelar: "Cancelar",
    escolha: function (n) { return "Este navegador já tem " + n + " tarefa(s). Juntar mantém o que está aqui e acrescenta o que é novo."; },
    okJuntar: function (a, j) { return a + " acrescentada(s), " + j + " já existia(m). Recarregando."; },
    confirmaSub: "Substituir tudo que está neste navegador?",
    aviso: "O dado vive só neste navegador. Faça cópia antes de limpar histórico ou trocar de celular.",
    copiaNunca: "Nenhuma cópia foi feita neste aparelho.",
    copiaEm: function (q, d) { return d === 0 ? "Última cópia: hoje." : "Última cópia: " + q + ", há " + d + " dia(s)."; },
    copiaAtrasada: "Passou de uma semana. Faça a cópia agora."
  };

  var PESO = { micro: 1, media: 3, longa: 8 };

  /* ---------------- leitura do estado interno ---------------- */
  function lerEstado() {
    try {
      var bruto = localStorage.getItem(CHAVE);
      if (!bruto) return null;
      var o = JSON.parse(bruto);
      if (!o || typeof o !== "object") return null;
      return { equipe: o.equipe || [], tarefas: o.tarefas || [], feitas: o.feitas || {} };
    } catch (e) { return null; }
  }
  /* Nunca grava lista vazia por cima de lista cheia. Um pacote que só traz
     tarefas não pode apagar a equipe, e o app trata [] como "é isso mesmo".
     Chave ausente ele ignora e mantém o que tem. */
  function gravarEstado(e) {
    var atual = lerEstado() || {};
    var o = { feitas: e.feitas || {} };
    var equipe = (e.equipe || []).length ? e.equipe : (atual.equipe || []);
    var tarefas = (e.tarefas || []).length ? e.tarefas : (atual.tarefas || []);
    if (equipe.length) o.equipe = equipe;
    if (tarefas.length) o.tarefas = tarefas;
    localStorage.setItem(CHAVE, JSON.stringify(o));
  }

  function idProjeto(nome) {
    return String(nome || "sem-projeto").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48) || "sem-projeto";
  }

  /* ---------------- conversão para o contrato ---------------- */
  function paraPacote(e) {
    var pessoas = (e.equipe || []).map(function (p) {
      return {
        org_id: ORG, pessoa_id: p.id, nome: p.nome || p.id,
        papel: p.papel || "", idioma: p.lang || "pt",
        extras: { admin: !!p.admin, papelEn: p.papelEn || "", arvore: p.sol || "" }
      };
    });

    var vistos = {}, projetos = [];
    (e.tarefas || []).forEach(function (t) {
      var id = idProjeto(t.projeto);
      if (!vistos[id]) {
        vistos[id] = true;
        projetos.push({
          org_id: ORG, projeto_id: id, nome: t.projeto || "Sem projeto",
          extras: { nomeEn: t.projetoEn || "" }
        });
      }
    });

    var tarefas = (e.tarefas || []).map(function (t) {
      var feita = (e.feitas || {})[t.id] || "";
      return {
        org_id: ORG, tarefa_id: t.id, titulo: t.texto || "",
        pessoa_id: t.pessoa || "", projeto_id: idProjeto(t.projeto),
        horizonte: t.h || "", peso: PESO[t.h] || null,
        concluida: !!feita, concluida_em: feita || null,
        depende_de: t.depende || null,
        extras: { tituloEn: t.textoEn || "", projeto_nome: t.projeto || "" }
      };
    });

    var pacote = N.criarPacote({ org_id: ORG, app: "gestao-physis", usuario: "anexo" });
    pacote.tabelas = { pessoa: pessoas, projeto: projetos, tarefa: tarefas };
    pacote.resumo = {
      pessoas: pessoas.length, projetos: projetos.length, tarefas: tarefas.length,
      concluidas: tarefas.filter(function (t) { return t.concluida; }).length,
      bloqueadas: tarefas.filter(function (t) { return t.depende_de && !t.concluida; }).length
    };
    return pacote;
  }

  function doPacote(pacote) {
    var lido = N.lerPacote(pacote);
    if (!lido.ok) return null;
    var tb = lido.pacote.tabelas || {};
    // nome em inglês do projeto vive na tabela projeto, não na tarefa.
    // Sem este mapa ele some na volta, e a Marzia trabalha em inglês.
    var nomeEnPorProjeto = {}, nomePorProjeto = {};
    (tb.projeto || []).forEach(function (j) {
      nomeEnPorProjeto[j.projeto_id] = (j.extras || {}).nomeEn || "";
      nomePorProjeto[j.projeto_id] = j.nome || "";
    });
    var equipe = (tb.pessoa || []).map(function (p) {
      var x = p.extras || {}, o = {
        id: p.pessoa_id || N.normalizarOrg(p.nome), nome: p.nome, lang: p.idioma || "pt"
      };
      // admin só existe em quem é admin. Escrever admin:false em todo mundo não
      // perde dado, mas suja a comparação entre duas cópias do arquivo.
      if (x.admin) o.admin = true;
      o.papel = p.papel || ""; o.papelEn = x.papelEn || ""; o.sol = x.arvore || "";
      return o;
    });
    var feitas = {};
    var tarefas = (tb.tarefa || []).map(function (t) {
      var x = t.extras || {};
      if (t.concluida_em) feitas[t.tarefa_id] = t.concluida_em;
      return {
        id: t.tarefa_id, pessoa: t.pessoa_id, h: t.horizonte || "micro",
        depende: t.depende_de || null,
        projeto: x.projeto_nome || nomePorProjeto[t.projeto_id] || t.projeto_id || "",
        projetoEn: nomeEnPorProjeto[t.projeto_id] || "",
        texto: t.titulo || "", textoEn: x.tituloEn || ""
      };
    });
    return { equipe: equipe, tarefas: tarefas, feitas: feitas };
  }

  /* ---------------- planilha ---------------- */
  function paraCsv(e) {
    var porPessoa = {};
    (e.equipe || []).forEach(function (p) { porPessoa[p.id] = p.nome || p.id; });
    var linhas = [["org_id", "tarefa_id", "pessoa", "projeto", "horizonte", "peso",
      "concluida", "concluida_em", "depende_de", "titulo"]];
    (e.tarefas || []).forEach(function (t) {
      var f = (e.feitas || {})[t.id] || "";
      linhas.push([ORG, t.id, porPessoa[t.pessoa] || t.pessoa || "", t.projeto || "",
        t.h || "", PESO[t.h] || "", f ? "sim" : "nao", f, t.depende || "",
        String(t.texto || "").replace(/[;\n\r]/g, " ")]);
    });

  }

  /* ---------------- arquivo ---------------- */
  function baixar(nome, conteudo, tipo) {
    var b = new Blob([conteudo], { type: tipo }), u = URL.createObjectURL(b);
    var a = document.createElement("a");

  }
  function hoje() { return new Date().toISOString().slice(0, 10); }

  /* ---------------- ações ---------------- */
  var elUltima = null;
  function lerUltima() {
    try { return localStorage.getItem("gestao-physis:ultima-copia"); } catch (err) { return null; }
  }
  function pintarUltima() {
    if (!elUltima) return;
    var iso = lerUltima();
    if (!iso) {
      elUltima.style.color = "#8E3A1E";
      elUltima.style.fontWeight = "600";
      elUltima.textContent = T.copiaNunca;
      return;
    }
    var d = new Date(iso);
    var dias = Math.floor((Date.now() - d.getTime()) / 864e5);
    var quando = ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2);
    var atrasada = dias >= 7;
    elUltima.style.color = atrasada ? "#8E3A1E" : "#5A6154";
    elUltima.style.fontWeight = atrasada ? "600" : "400";
    elUltima.textContent = T.copiaEm(quando, dias) + (atrasada ? " " + T.copiaAtrasada : "");
  }
  function exportar() {
    var e = lerEstado();
    if (!e) return dizer(T.vazio, true);
    var p = paraPacote(e);
    baixar("physis_gestao_" + hoje() + ".json", JSON.stringify(p, null, 2), "application/json");
    try { localStorage.setItem("gestao-physis:ultima-copia", new Date().toISOString()); } catch (err) {}
    pintarUltima();
    dizer(T.okExport(p.resumo.pessoas + p.resumo.projetos + p.resumo.tarefas), false);
  }
  function planilha() {
    var e = lerEstado();
    if (!e) return dizer(T.vazio, true);
    baixar("physis_gestao_" + hoje() + ".csv", paraCsv(e), "text/csv;charset=utf-8");
    dizer(T.okExport((e.tarefas || []).length), false);
  }
  /* Juntar por id. Em conflito, o que já está no aparelho vence: ninguém perde
     edição própria por causa de um arquivo que alguém mandou. */
  function juntar(atual, novo) {
    var r = { equipe: (atual.equipe || []).slice(), tarefas: (atual.tarefas || []).slice(),
              feitas: Object.assign({}, atual.feitas || {}) };
    var idsP = {}, idsT = {};
    r.equipe.forEach(function (p) { idsP[p.id] = true; });
    r.tarefas.forEach(function (t) { idsT[t.id] = true; });
    var add = 0, ja = 0;
    (novo.equipe || []).forEach(function (p) { if (!idsP[p.id]) { r.equipe.push(p); idsP[p.id] = true; } });
    (novo.tarefas || []).forEach(function (t) {
      if (idsT[t.id]) { ja++; return; }
      r.tarefas.push(t); idsT[t.id] = true; add++;
    });
    Object.keys(novo.feitas || {}).forEach(function (k) {
      if (r.feitas[k] === undefined && idsT[k]) r.feitas[k] = novo.feitas[k];
    });
    return { estado: r, acrescentadas: add, jaExistiam: ja };
  }

  function aplicar(e, texto) {
    gravarEstado(e);
    dizer(texto, false);
    setTimeout(function () { location.reload(); }, 900);
  }

  function escolher(novo) {
    var atual = lerEstado();
    var caixaEscolha = document.getElementById("pa-escolha");
    if (caixaEscolha) caixaEscolha.remove();
    var div = document.createElement("div");
    div.id = "pa-escolha";
    div.style.cssText = "margin-top:8px;padding-top:8px;border-top:1px solid #C3D0BD";
    var b = "border-radius:3px;padding:6px 11px;font:inherit;cursor:pointer;min-height:36px;margin:3px 5px 0 0";

      "<button id='pa-sub' style=\"background:transparent;color:#A63A28;border:1px solid #E3C4BD;" + b + "\">" + T.substituir + "</button>" +
      "<button id='pa-can' style=\"background:transparent;color:#5A6154;border:1px solid #C3D0BD;" + b + "\">" + T.cancelar + "</button>";
    caixa.appendChild(div);
    div.querySelector("#pa-jun").onclick = function () {
      var r = juntar(atual, novo);
      div.remove();
      aplicar(r.estado, T.okJuntar(r.acrescentadas, r.jaExistiam));
    };
    div.querySelector("#pa-sub").onclick = function () {
      if (!window.confirm(T.confirmaSub)) return;
      div.remove();
      aplicar(novo, T.okImport((novo.tarefas || []).length));
    };
    div.querySelector("#pa-can").onclick = function () { div.remove(); dizer("", false); };
  }

  function importar(texto) {
    var j;
    try { j = JSON.parse(texto); } catch (err) { return dizer(T.erro, true); }
    var novo = doPacote(j);
    if (!novo) return dizer(T.erro, true);
    var atual = lerEstado();
    var temDado = atual && ((atual.tarefas || []).length || (atual.equipe || []).length);
    if (!temDado) return aplicar(novo, T.okImport((novo.tarefas || []).length));
    escolher(novo);
  }

  /* ---------------- barra ---------------- */
  var caixa, msg;
  function dizer(texto, ruim) {
    if (!msg) return;
    msg.textContent = texto;
    msg.style.color = ruim ? "#A63A28" : "#33512F";
  }
  function montar() {
    if (document.getElementById("physis-anexo")) return;
    caixa = document.createElement("div");
    caixa.id = "physis-anexo";
    caixa.setAttribute("role", "region");
    caixa.setAttribute("aria-label", T.titulo);
    caixa.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:99999;" +
      "background:#F7F8F4;border:1px solid #C3D0BD;border-radius:6px;padding:10px 12px;" +
      "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;" +
      "font-size:13.5px;color:#14180F;box-shadow:0 1px 0 rgba(0,0,0,.06);max-width:min(94vw,340px)";
    var bs = "background:#4B7547;color:#fff;border:1px solid #4B7547;border-radius:3px;" +
      "padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;min-height:38px";
    var bv = bs.replace("background:#4B7547;color:#fff", "background:transparent;color:#4B7547")
      .replace("border:1px solid #4B7547", "border:1px solid #C3D0BD");
    caixa.innerHTML =
      "<div style='font-weight:600;margin-bottom:7px'>" + T.titulo + "</div>" +
      "<div style='display:flex;gap:7px;flex-wrap:wrap'>" +
      "<button id='pa-exp' style=\"" + bs + "\">" + T.exportar + "</button>" +
      "<button id='pa-imp' style=\"" + bv + "\">" + T.abrir + "</button>" +
      "<button id='pa-csv' style=\"" + bv + "\">" + T.planilha + "</button>" +
      "</div>" +
      "<div id='pa-ult' style='margin-top:7px;font-size:12.5px'></div>" +
      "<div id='pa-msg' style='margin-top:4px;font-size:12.5px;min-height:1.2em'></div>" +
      "<div style='margin-top:5px;font-size:12px;color:#5A6154;line-height:1.45'>" + T.aviso + "</div>" +
      "<input type='file' id='pa-arq' accept='application/json,.json' style='display:none'>";
    document.body.appendChild(caixa);
    msg = caixa.querySelector("#pa-msg");
    elUltima = caixa.querySelector("#pa-ult");
    pintarUltima();
    caixa.querySelector("#pa-exp").onclick = exportar;
    caixa.querySelector("#pa-csv").onclick = planilha;
    caixa.querySelector("#pa-imp").onclick = function () { caixa.querySelector("#pa-arq").click(); };
    caixa.querySelector("#pa-arq").onchange = function (ev) {
      var f = ev.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { importar(fr.result); };
      fr.readAsText(f);
      ev.target.value = "";
    };
  }

  window.PhysisAnexo = {
    lerEstado: lerEstado, gravarEstado: gravarEstado,
    paraPacote: paraPacote, doPacote: doPacote, paraCsv: paraCsv, juntar: juntar,
    exportar: exportar, importar: importar, montar: montar, CHAVE: CHAVE
  };

  // montar() é idempotente, então dá para tentar em todos os momentos possíveis:
  // anexado antes de </body> o estado é "loading"; carregado depois, já não é.
  try { montar(); } catch (e) { /* o corpo ainda não existe */ }
  document.addEventListener("DOMContentLoaded", montar);
  window.addEventListener("load", montar);
})();

</script>

  /* Aceita "1.234,56" e "1234.56". Devolve número ou null — nunca zero

  function lerNumero(txt) {
    if (txt === null || txt === undefined) return null;
    var s = String(txt).trim();
    if (!s) return null;
    s = s.replace(/[^\d,.\-]/g, "");
    if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
      s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".")

    } else if (s.indexOf(",") > -1) {

    } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) {

         "1.234.567" são milhares em português, não decimal. Já "1234.56"

  function consolidar() {

      var v = lerNumero(l.valor);

    var lista = Object.keys(mapa).map(function (k) { return mapa[k]; });
    lista.sort(function (a, b) {
      var da = (a.entrada - a.saida), db = (b.entrada - b.saida);
      if (Math.abs(db) !== Math.abs(da)) return Math.abs(db) - Math.abs(da);
      return (b.abertas + b.feitas) - (a.abertas + a.feitas);
    });
    return lista;
  }

        "</select>") +
      "</div>" +

  function moverTarefas(filtro, destino) {
    var app = lerApp();
    if (!app) { dizer(T.erroArq, true); return; }
    var n = 0;
    app.tarefas = (app.tarefas || []).map(function (t) {
      if (!filtro(t)) return t;
      n++;
      var novo = {}; for (var k in t) if (t.hasOwnProperty(k)) novo[k] = t[k];
      novo.pessoa = destino;
      /* Tarefa não pode esperar quem a executa: seria bloqueio de si mesma, e o
         painel da Direção contaria como trabalho parado para sempre. */
      if (novo.depende === destino) novo.depende = null;
      return novo;
    });
    if (!n) return;
    try { localStorage.setItem(CHAVE_APP, JSON.stringify(app)); }
    catch (e) { dizer(T.erroArq, true); return; }
    dizer(T2.movida(n), false);
    setTimeout(function () { location.reload(); }, 800);
  }

  /* ------------------------------------------------------------- entradas */

  var formComp = null, EXT_COMP = /\.(jpe?g|png|webp|heic|heif|gif|pdf|xlsx|xls|xlsm|csv|docx|doc)$/i;
  function lerFormLanc() { var g = function (id) { var e = document.getElementById(id); return e ? e.value : ""; };

      "<button type='button' id='adm-comp-add' aria-describedby='adm-comp-aj' style=\"" + estVazado + ";min-height:44px\">" + esc(T6.anexarComp) + "</button><input type='file' id='adm-comp-arq' multiple accept='image/*,.pdf,.xlsx,.xls,.xlsm,.csv,.docx,.doc' tabindex='-1' aria-hidden='true' style='display:none'></div>"; }
  function receberComprovantes(arquivos) {
    var v = lerFormLanc(); editando = Object.assign(editando || { id: novoId(), _novo: true }, v);
    var lista = Array.prototype.slice.call(arquivos), ruins = [], bons = [], cs = compDoForm(), feitos = 0;
    lista.forEach(function (f) { if (!EXT_COMP.test(f.name) || f.size > MAX_ANEXO) ruins.push(f.name); else bons.push(f); });
    var fim = function () { pintar(); dizer(ruins.length ? T6.compTipo + ruins.join(", ") : T6.compN(cs.length), ruins.length > 0); var b = document.getElementById("adm-comp-add"); if (b) b.focus(); };
    if (!bons.length) return fim();
    bons.forEach(function (f) { var id = "comp-" + novoId(); guardarAnexo(id, f, function (ok) { if (ok) cs.push({ id: id, nome: f.name, tamanho: f.size }); feitos++; if (feitos === bons.length) fim(); }); });
  }
  function baixarComprovante(a) { lerAnexo(a.id, function (arq) { if (!arq) return dizer(T3.anexoSumiu, true); var u = URL.createObjectURL(arq), l = document.createElement("a"); l.href = u; l.download = a.nome; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); }); }
  function salvarLancamento() {
    var g = function (id) { var e = document.getElementById(id); return e ? e.value : ""; };
    var desc = g("adm-desc").trim();
    var valor = g("adm-valor").trim();
    if (!desc && !valor) { dizer(T.desc + " ?", true); return; }
    var d = lerAdm();
    var reg = {
      id: editando ? editando.id : novoId(),
      data: g("adm-data") || hoje(),
      area: g("adm-area"), projeto: g("adm-proj").trim(),
      descricao: desc, tipo: g("adm-tipo"), valor: valor, situacao: g("adm-sit"),
      contratoId: g("adm-contrato"), nf: g("adm-nf").trim(), comprovantes: compDoForm().slice()
    };
    formComp = null;
    if (editando && !editando._novo) {
      d.lancamentos = d.lancamentos.map(function (l) { return l.id === reg.id ? reg : l; });
    } else { d.lancamentos.push(reg); }
    editando = null;
    if (!gravarAdm(d)) { dizer(T.erroArq, true); return; }
    dizer("", false); pintar();

  function acrescentarTarefa() {

      var s = l.situacao || "previsto", m = String(l.data || "").slice(0, 7) || "—";
      porS[s] = porS[s] || { e: 0, s: 0 }; porM[m] = porM[m] || { e: 0, s: 0 };
      if (l.tipo === "entrada") { porS[s].e += v; porM[m].e += v; } else { porS[s].s += v; porM[m].s += v; } });
    var tab = function (titulo, col, chaves, nome) {
      var h = "<div style='font-weight:600;font-size:13.5px;margin:18px 0 8px'>" + esc(titulo) + "</div><div style='overflow-x:auto'><table style='width:100%;border-collapse:collapse;min-width:420px'><thead><tr>";
      [col, T.entradas, T.saidas, T.saldo].forEach(function (c, i) { h += "<th style=\"" + estCel + ";font-size:12.5px;font-weight:600" + (i ? ";text-align:right" : "") + "\">" + esc(c) + "</th>"; });

      chaves.forEach(function (k) { var x = (titulo === T3.porSit ? porS : porM)[k]; if (!x) return;
        h += "<tr><td style=\"" + estCel + "\">" + esc(nome(k)) + "</td><td style=\"" + estCel + ";text-align:right\">" + esc(moeda(x.e)) + "</td><td style=\"" + estCel + ";text-align:right\">" + esc(moeda(x.s)) + "</td><td style=\"" + estCel + ";text-align:right;color:" + (x.e - x.s < 0 ? C.alerta : C.tinta) + "\">" + esc(moeda(x.e - x.s)) + "</td></tr>"; });
      return h + "</tbody></table></div>";
    };
    return tab(T3.porSit, T.sit, ["previsto", "confirmado", "liquidado"], function (k) { return rotulo(SITUACOES, k); }) +

  /* Detalhe automático por projeto e por consultor, a partir do time definido em cada contrato. */

    var cel = function (v, esq) { return "<td style=\"" + estCel + ";text-align:" + (esq ? "left" : "right") + ";font-variant-numeric:tabular-nums\">" + esc(v) + "</td>"; };
    var titulo = function (t) { return "<div style='font-weight:600;font-size:14.5px;margin:18px 0 6px'>" + esc(t) + "</div>"; };
    var hP = titulo(EN ? "By project: revenue, taxes, costs and shares" : "Por projeto: receita, impostos, custos e partes") + "<div style='overflow-x:auto'><table style='width:100%;border-collapse:collapse;min-width:760px'>" +
      cab(EN ? ["Project", "Contract", "Fixed fees", "Partnership taxes (20%)", "Partnership costs", "Partners' share", "Physis keeps"] : ["Projeto", "Contrato", "Consultoria (taxas fixas)", "Impostos das parcerias (20%)", "Custos das parcerias", "Parte dos parceiros", "Fica com a Physis"]) + "<tbody>";
    var porC = {};
    als.forEach(function (a) {
      var c = cts.filter(function (x) { return x.id === a.contratoId; })[0] || {}, vc = lerNumero(c.valor) || 0, fixo = 0, imp = 0, custos = 0, parc = 0;
      (a.atividades || []).forEach(function (x) {
        var v = lerNumero(x.valor) || 0, k = x.consultor || "";
        if (x.modelo === "parceria") { var pc = contaParceria(x); imp += pc.impostos; custos += pc.custos; parc += pc.parte; } else fixo += v;
        if (k) { porC[k] = porC[k] || { fixo: 0, parc: 0, n: 0, aceito: 0, projs: {} }; porC[k][x.modelo === "parceria" ? "parc" : "fixo"] += v; porC[k].n++; porC[k].projs[a.projeto] = true; if ((a.consultores || {})[k] && a.consultores[k].estado === "aceito") porC[k].aceito += v; }
      });
      hP += "<tr>" + cel(a.projeto, true) + cel(moeda(vc)) + cel(moeda(fixo)) + cel(moeda(imp)) + cel(moeda(custos)) + cel(moeda(parc)) + cel(moeda(vc - fixo - imp - custos - parc)) + "</tr>";
    });

      cab(EN ? ["Person", "Projects", "Activities", "Fixed fees", "Partnership (estimate)", "Total", "Already accepted"] : ["Pessoa", "Projetos", "Atividades", "Consultoria (taxa fixa)", "Parceria (estimativa)", "Total", "Já aceito"]) + "<tbody>";
    Object.keys(porC).forEach(function (k) { var x = porC[k]; hC += "<tr>" + cel(nomePessoa(k), true) + cel(String(Object.keys(x.projs).length)) + cel(String(x.n)) + cel(moeda(x.fixo)) + cel(moeda(x.parc)) + cel(moeda(x.fixo + x.parc)) + cel(moeda(x.aceito)) + "</tr>"; });
    hC += "</tbody></table></div><p style='font-size:12.5px;margin:6px 0 0'>" + esc(EN ? "Partnership values are estimates until all costs are settled." : "Os valores de parceria são estimativa até a quitação de todos os custos.") + "</p>";
    return hP + hC;

<script>
/* Padrão Physis · modo de conforto: um clique, reversível, lembrado neste navegador. */
(function(){
  var K='physis-conforto', b=document.getElementById('px-conforto'), h=document.documentElement;
  function ler(){ try{return localStorage.getItem(K)==='1';}catch(e){return false;} }
  function aplicar(on){ h.classList.toggle('px-conforto',on); if(b){b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'Modo de conforto: ligado':'Modo de conforto';} }
  aplicar(ler());
  if(b) b.addEventListener('click',function(){ var on=!h.classList.contains('px-conforto');
    try{localStorage.setItem(K,on?'1':'0');}catch(e){} aplicar(on); });
})();
/* Padrão Physis · rótulos: todo campo de tabela ganha o nome da coluna e da linha. */
(function(){
  function temNome(el){ return el.getAttribute('aria-label')||el.getAttribute('aria-labelledby')||el.closest('label')||
    (el.id&&document.querySelector('label[for="'+el.id+'"]')); }
  function rotular(){
    document.querySelectorAll('table').forEach(function(t){
      var ths=[].map.call(t.querySelectorAll('thead th'),function(th){return th.textContent.trim();});

  /* ══ E-mails a enviar (14/11/2026) ══
     Os e-mails de acesso que o servidor escreve sozinho ao aprovar uma compra. Com o servidor de
     e-mail da Physis configurado, saem sozinhos; sem ele, a equipe copia, envia e marca como enviado. */
  var mailsMsg = "";
  function pintarEmails() {
    var s = document.getElementById("gp-mails"); if (!s) return;
    var cab = "<h1 id='gp-h-mails'>" + esc(L("E-mails a enviar", "E-mails to send")) + "</h1><p style='margin:0 0 14px;color:#4A4F44;max-width:760px'>" +
      esc(L("Quando uma compra é aprovada, o servidor monta a plataforma do cliente e escreve o e-mail de acesso, com número, link e código de ativação.", "When a purchase is approved, the server sets up the client platform and writes the access e-mail, with number, link and activation code.")) + "</p>";
    if (!/^https?:$/.test(location.protocol)) { s.innerHTML = cab + "<p>" + esc(L("Só funciona com o servidor da Physis.", "Works only with the Physis server.")) + "</p>"; return; }
    fetch("/api/central/emails", { cache: "no-store" }).then(function (r) { return r.status === 401 ? { login: true } : r.json(); }).then(function (j) {
      if (j.login) { s.innerHTML = cab + "<p>" + esc(L("Entre no servidor para ver os e-mails.", "Sign in to the server to see the e-mails.")) + "</p>"; return; }
      var lista = (j.emails || []).slice().reverse(), pend = lista.filter(function (e) { return e.estado === "pendente" || e.estado === "falhou"; }).length;
      var h = cab + "<p role='status' style='font-weight:600'>" + esc(mailsMsg) + "</p>" +
        "<div style='" + CART + "'>" + esc(j.configurado ? L("Servidor de e-mail da Physis ligado: os e-mails saem sozinhos.", "Physis e-mail server connected: e-mails go out by themselves.")
                                                       : L("Servidor de e-mail da Physis ainda não configurado: copie cada e-mail, envie e marque como enviado.", "Physis e-mail server not configured yet: copy each e-mail, send it and mark it as sent.")) +
        " " + esc(pend + L(" pendente(s).", " pending.")) + "</div>";
      if (!lista.length) h += "<p>" + esc(L("Nenhum e-mail ainda.", "No e-mails yet.")) + "</p>";
      lista.forEach(function (e) {
        var cor = e.estado === "pendente" ? "#5E4408" : e.estado === "falhou" ? "#7A2214" : "#1F4A1C";
        h += "<article style='" + CART + "' aria-labelledby='gm-" + e.id + "'><h2 id='gm-" + e.id + "' style='font-size:1.1em;margin:0 0 4px'>" + esc(e.assunto) + "</h2>" +
          "<p style='margin:0 0 8px'>" + esc(L("Para: ", "To: ") + e.para) + " · <strong style='color:" + cor + "'>" + esc({ pendente: L("pendente", "pending"), falhou: L("falhou", "failed"), enviado: L("enviado", "sent"), enviado_a_mao: L("enviado à mão", "sent by hand") }[e.estado] || e.estado) + "</strong>" + (e.erro ? " · " + esc(e.erro) : "") + "</p>" +
          "<details><summary style='cursor:pointer;min-height:44px;display:flex;align-items:center'>" + esc(L("Ver o texto", "View the text")) + "</summary><pre style='white-space:pre-wrap;background:#F4F6F1;border:1px solid #C9D2C4;border-radius:8px;padding:10px;font:inherit' tabindex='0'>" + esc(e.corpo) + "</pre></details>" +
          (e.estado === "pendente" || e.estado === "falhou" ? "<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px'><button type='button' data-gm-copiar='" + e.id + "' style='" + BOT + "'>" + esc(L("Copiar o e-mail", "Copy the e-mail")) + "</button>" +
            "<button type='button' data-gm-feito='" + e.id + "' style='" + BOTP + "'>" + esc(L("Marcar como enviado", "Mark as sent")) + "</button>" +
            (j.configurado ? "<button type='button' data-gm-enviar='" + e.id + "' style='" + BOT + "'>" + esc(L("Enviar de novo pelo servidor", "Send again via the server")) + "</button>" : "") + "</div>" : "") + "</article>";
      });
      s.innerHTML = h; s._lista = lista;
    }).catch(function () { s.innerHTML = cab + "<p>" + esc(L("O servidor não respondeu.", "The server did not answer.")) + "</p>"; });
  }
  function ligarEmails() {
    var s = document.getElementById("gp-mails");
    s.addEventListener("click", function (ev) { var b = ev.target.closest ? ev.target.closest("button") : null; if (!b) return; var id;
      if ((id = b.getAttribute("data-gm-copiar"))) { var e = (s._lista || []).filter(function (x) { return String(x.id) === id; })[0]; if (!e) return;
        var txt = L("Para: ", "To: ") + e.para + "\n" + L("Assunto: ", "Subject: ") + e.assunto + "\n\n" + e.corpo;
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { mailsMsg = L("E-mail copiado. Cole no seu programa de e-mail.", "E-mail copied. Paste it in your e-mail program."); pintarEmails(); }, function () { mailsMsg = L("Não foi possível copiar: abra 'Ver o texto' e copie.", "Could not copy: open 'View the text' and copy."); pintarEmails(); }); return; }
      if ((id = b.getAttribute("data-gm-feito")) || (id = b.getAttribute("data-gm-enviar"))) { var feito = b.hasAttribute("data-gm-feito");
        fetch("/api/central/emails/" + id + (feito ? "/enviado" : "/enviar"), { method: "POST", body: "{}" }).then(function (r) { return r.json(); }).then(function (j) {
          mailsMsg = j.ok ? (feito ? L("Marcado como enviado. O código deixou de ficar guardado no servidor.", "Marked as sent. The code is no longer stored on the server.") : L("Enviado.", "Sent.")) : L("Não foi possível: ", "Could not: ") + (j.erro || ""); pintarEmails(); }); } });
  }

  /* ══ Melhorias do Sistema Physis: entram uma vez num navegador que já tem dados ══
     Navegador novo recebe pela semente do aplicativo (window.PHYSIS_MELHORIAS). */
  function juntarMelhorias() {
    // Guarda quais melhorias já foram oferecidas a este navegador: as novas entram, as apagadas pela pessoa não voltam.
    var FL = "gestao-physis:melhorias-oferecidas", ANTIGA = "gestao-physis:melhorias-2026-11-14", L0 = window.PHYSIS_MELHORIAS || [], A = window.PhysisAnexo;
    if (!L0.length || !A) return;
    try {
      var ofer = JSON.parse(localStorage.getItem(FL) || "[]");
      if (!ofer.length && localStorage.getItem(ANTIGA)) for (var i = 1; i <= 33; i++) ofer.push("mel-" + ("0" + i).slice(-2));
      var novas = L0.filter(function (t) { return ofer.indexOf(t.id) < 0; }); if (!novas.length) return;
      var e = A.lerEstado(); localStorage.setItem(FL, JSON.stringify(ofer.concat(novas.map(function (t) { return t.id; }))));
      if (!e || !(e.tarefas || []).length) return;   // navegador novo: a semente do aplicativo já traz todas
      var ids = {}; e.tarefas.forEach(function (t) { ids[t.id] = true; });
      var falta = novas.filter(function (t) { return !ids[t.id]; }); if (!falta.length) return;
      e.tarefas = e.tarefas.concat(falta); e.feitas = e.feitas || {};
      var F = window.PHYSIS_MELHORIAS_FEITAS || {}; Object.keys(F).forEach(function (k) { if (!e.feitas[k]) e.feitas[k] = F[k]; });
      A.gravarEstado(e); location.reload();
    } catch (x) { /* sem localStorage: segue sem juntar */ }
  }

  function montar() {
    if (document.getElementById("gp-menu") || !document.getElementById("app")) return;
    juntarMelhorias();
    raiz.classList.add("gp");
    var tit = document.querySelector(".px-faixa .px-tit"); if (tit) tit.textContent = "Gestão Physis";
    menu = document.createElement("nav"); menu.id = "gp-menu"; menu.setAttribute("aria-label", "Partes da Gestão Physis");
    ITENS.forEach(function (i) { var b = document.createElement("button"); b.type = "button"; b.id = "gp-m-" + i[0]; b.textContent = i[1]; b.onclick = function () { ir(i[0], true); }; menu.appendChild(b); });
    /* Quem está usando e “Meus contratos” ficam no menu: o cabeçalho do aplicativo some nas outras partes. */
    var cx = document.createElement("div"); cx.className = "gp-quem"; cx.innerHTML = "<label for='gp-pessoa'>Quem está usando</label><select id='gp-pessoa'></select>"; menu.insertBefore(cx, menu.firstChild);
    var sel = cx.querySelector("select"), sincroniza = function () { var o = document.querySelector("#app select"); if (!o) return; if (sel.options.length !== o.options.length) { sel.innerHTML = ""; Array.prototype.forEach.call(o.options, function (x) { var y = document.createElement("option"); y.value = x.value; y.textContent = x.textContent; sel.appendChild(y); }); } if (document.activeElement !== sel && sel.value !== o.value) sel.value = o.value; };
    sel.onchange = function () { var o = document.querySelector("#app select"); if (!o) return; var set = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, "value").set; set.call(o, sel.value); o.dispatchEvent(new Event("change", { bubbles: true })); };
    sincroniza(); setInterval(sincroniza, 500);
    setInterval(function () { var ax = document.getElementById("physis-anexo"); if (ax && ax !== document.body.lastElementChild) document.body.appendChild(ax); }, 600);
    var idiomaAntes = null; setInterval(function () { var en = emIngles(); if (en !== idiomaAntes) { idiomaAntes = en; rotular(); if (atual === "reun") pintarReunioes(); if (atual === "docs") pintarDocs(); } }, 400);
    var bm = document.createElement("button"); bm.type = "button"; bm.id = "gp-m-meus"; bm.textContent = "Meus contratos"; bm.onclick = function () { var x = document.getElementById("adm-meus"); if (x) x.click(); }; menu.appendChild(bm);
    var n = document.createElement("div"); n.className = "gp-nota"; n.textContent = "Clientes e suporte ficam na Central de clientes, uma interface separada, ainda em construção."; menu.appendChild(n);
    var f = document.querySelector(".px-faixa"); f.parentNode.insertBefore(menu, f.nextSibling);
    var c = document.createElement("section"); c.id = "gp-cursos"; c.tabIndex = -1; c.setAttribute("aria-labelledby", "gp-h-cursos");
    c.innerHTML = "<h1 id='gp-h-cursos'>Cursos e turmas</h1><div class='gp-aviso'><strong>Ainda não construído.</strong> O desenho desta parte foi aprovado: cursos e turmas, com inscritos, concluintes e receita, e cada inscrição virando lançamento no Financeiro. Faltam os nomes dos cursos, as cargas, os preços e a plataforma de cursos.</div>";
    document.body.appendChild(c);
    ["gp-reun","gp-docs"].forEach(function (id) { var x = document.createElement("section"); x.id = id; x.className = "gp-sec"; x.tabIndex = -1; x.setAttribute("aria-labelledby", id === "gp-reun" ? "gp-h-reun" : "gp-h-docs"); document.body.appendChild(x); });
    var viv = document.createElement("div"); viv.id = "gp-aviso-vivo"; viv.setAttribute("role", "status"); viv.setAttribute("aria-live", "polite"); viv.style.cssText = "margin-left:220px;padding:0 26px 18px;font-weight:600;min-height:1.5em"; document.body.appendChild(viv);
    // Reuniões em três partes: topo (título), chamada (não é redesenhada) e registro
    var reunS = document.getElementById("gp-reun");
    var topoR = document.createElement("div"); topoR.id = "gp-reun-topo"; topoR.className = "gp-sec"; topoR.tabIndex = -1; reunS.parentNode.insertBefore(topoR, reunS);
    var chS = document.createElement("section"); chS.id = "gp-chamada"; chS.className = "gp-sec"; chS.setAttribute("aria-labelledby", "gp-h-ch"); reunS.parentNode.insertBefore(chS, reunS);
    var mailsS = document.createElement("section"); mailsS.id = "gp-mails"; mailsS.className = "gp-sec"; mailsS.tabIndex = -1; mailsS.setAttribute("aria-labelledby", "gp-h-mails"); document.body.appendChild(mailsS);
    ligarReunioes(); ligarDocs(); ligarChamada(); ligarEmails();
    var app = document.getElementById("app"), al = document.createElement("section"); al.id = "gp-alertas"; al.setAttribute("aria-labelledby", "gp-h-alertas"); al.hidden = true;
    // sem o cabeçalho do aplicativo, Atividades precisa do próprio h1 para o leitor de tela
    var h1 = document.createElement("h1"); h1.id = "gp-h-atv"; h1.className = "gp-so-leitor"; h1.textContent = "Atividades";
    app.parentNode.insertBefore(h1, app); app.parentNode.insertBefore(al, app);
    arrumarTitulo(); setInterval(arrumarTitulo, 1000);
    setInterval(function () { if (atual === "atv") pintarAlertas(); }, 2000);
    marcar("atv"); topo(); window.addEventListener("resize", topo); window.addEventListener("scroll", topo, { passive: true });
    // cliques nas abas internas e aberturas por endereço (#adm=prop) mantêm o menu em dia
    document.addEventListener("click", function (ev) { var t = ev.target && ev.target.closest ? ev.target.closest("#physis-adm [data-aba]") : null; if (t) { var g = grupoDe[t.getAttribute("data-aba")], p = document.getElementById("physis-adm"); if (g && p) { p.setAttribute("data-grupo", g); marcar(g); } } }, true);
    setInterval(function () { var p = document.getElementById("physis-adm"), aberto = p && p.style.display !== "none"; if (aberto && !raiz.classList.contains("gp-v-adm")) { var m = /adm=([a-z]+)/.exec(location.hash || ""), a = m ? (m[1] === "lanc" ? "plan" : m[1]) : "alert", g = grupoDe[a];
      if (g) { p.setAttribute("data-grupo", g); marcar(g); } else { var fx = document.getElementById("adm-fechar"); if (fx) fx.click(); marcar("atv"); var sa = document.getElementById("gp-alertas"); if (sa && !sa.hidden) sa.scrollIntoView(); } } else if (!aberto && raiz.classList.contains("gp-v-adm")) marcar("atv"); else if (!aberto && ["atv","mapa","dir"].indexOf(atual) >= 0) { var t = telaAtualDoApp(); if (t !== atual) marcar(t); } }, 300);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", montar); else montar();
  window.addEventListener("load", function () { setTimeout(montar, 300); });
  window.PhysisGestaoCasca = { ir: ir };
})();
</script>
</body>
