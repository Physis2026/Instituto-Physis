# Mosquitto para a Caixinha Physis IoT (docs/MQTT.md). Instalado em /etc/mosquitto/conf.d/physis.conf.
# Sem usuário anônimo; um usuário por nó ESPHome (mesmo nome do nó); ACL limita cada nó ao próprio tópico.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/physis/senhas
acl_file /etc/mosquitto/physis/acl

# rede local (o firewall do instalar.sh só abre 1883 para a rede local)
listener 1883

# Rede aberta: prefira TLS. Descomente e aponte para o certificado (ex.: o do Caddy ou um próprio).
# listener 8883
# certfile /etc/mosquitto/certs/servidor.crt
# keyfile  /etc/mosquitto/certs/servidor.key
# tls_version tlsv1.2

max_inflight_messages 20
max_queued_messages 1000
persistence true
