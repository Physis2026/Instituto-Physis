<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Planejador Physis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F4F7F2;--panel:#FFFFFF;--ink:#1E2A1D;--muted:#5C6B58;--line:#D6DED2;--brand:#4E7D4A;--brand-d:#2F5A2C;--soft:#E7EFE3;--ochre:#9A6A3A;--sky:#2E6E9E;--ok:#2E7D4F;--warn:#8A560B;--bad:#B23A2E;--focus:#2E6E9E;--on-brand:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111712;--panel:#19211A;--ink:#E3EBE0;--muted:#9DAD98;--line:#2C392C;--brand:#7FB27A;--brand-d:#A7D2A2;--soft:#223022;--ochre:#D1A26E;--sky:#7DB3DE;--ok:#6CC08F;--warn:#E3B05A;--bad:#E57A6E;--on-brand:#0E1A0D;color-scheme:dark}}
:root[data-theme="dark"]{--on-brand:#0E1A0D;--bg:#111712;--panel:#19211A;--ink:#E3EBE0;--muted:#9DAD98;--line:#2C392C;--brand:#7FB27A;--brand-d:#A7D2A2;--soft:#223022;--ochre:#D1A26E;--sky:#7DB3DE;--ok:#6CC08F;--warn:#E3B05A;--bad:#E57A6E;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Lexend","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0 0 .45em;line-height:1.2;font-weight:600}h2{font-size:1.45rem}h3{font-size:1.02rem}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;padding:.55rem 1.1rem;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.logo{height:34px;width:auto;display:block}.logo.dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
.appname{font-weight:600;color:var(--brand-d)}.appname small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.grow{flex:1}
button,.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.38rem .75rem;border-radius:7px;cursor:pointer}
button.primary,.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.steps{display:flex;gap:0;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:0 1.1rem}
.steps a{display:flex;align-items:center;gap:.45rem;padding:.7rem .9rem;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:.92rem}
.steps a .n{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;border:1.5px solid currentColor;font-size:.78rem}
.steps a[aria-current="true"]{color:var(--brand-d);border-bottom-color:var(--brand);font-weight:600}.steps a.done .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100vh - 110px)}
main{padding:1.1rem 1.3rem 4rem;min-width:0}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:.6rem .3rem}.tabs button[aria-selected="true"]{box-shadow:inset 0 -2px var(--brand);font-weight:600}
.side{padding:.75rem;overflow:auto;flex:1;max-height:calc(100vh - 160px)}
.lead{color:var(--muted);max-width:74ch;margin:.1rem 0 1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:0 0 1rem}
.drop{border:2px dashed var(--brand);border-radius:14px;padding:2.2rem 1rem;text-align:center;background:var(--soft)}
.drop.over{background:var(--panel)}.drop p{margin:.3rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem .9rem}
.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.15rem}
.row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:.9rem;padding:.33rem .45rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-width:0}
.field input,.field select{flex:1;width:100%}.unit{font-size:.8rem;color:var(--muted)}
.prov{font-size:.72rem;border-radius:999px;padding:.05rem .45rem;border:1px solid var(--line);cursor:pointer;white-space:nowrap;background:transparent}
.prov.est{color:var(--warn);border-color:var(--warn)}.prov.conf{color:var(--ok);border-color:var(--ok)}.prov.ter{color:var(--sky);border-color:var(--sky)}
.msg{font-size:.76rem;color:var(--bad)}.hint{font-size:.78rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{padding:.32rem .45rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
td input,td select{width:100%;font-size:.84rem;padding:.2rem .3rem}.scroll{overflow-x:auto}
.kpis{display:flex;flex-wrap:wrap;gap:.6rem;margin:.3rem 0 1rem}.kpi{background:var(--soft);border-radius:9px;padding:.5rem .8rem;min-width:8.5rem}.kpi b{display:block;font-size:1.12rem}.kpi span{font-size:.78rem;color:var(--muted)}
.chk{display:flex;gap:.5rem;padding:.45rem .1rem;border-bottom:1px solid var(--line);font-size:.86rem}.tag{font-size:.72rem;border-radius:4px;padding:0 .35rem;height:1.25rem;white-space:nowrap;color:var(--on-brand)}
.t-bad{background:var(--bad)}.t-warn{background:var(--warn)}.t-ok{background:var(--ok)}.t-info{background:var(--sky)}
.mapbox{position:relative}svg.map{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;touch-action:none;user-select:none}
.layers{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.84rem;margin:.4rem 0}
.palette{display:flex;flex-wrap:wrap;gap:.35rem}.palette button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.links a{color:var(--brand-d)}
.bubble{padding:.5rem .65rem;border-radius:8px;font-size:.88rem;white-space:pre-wrap;margin:.3rem 0}.b-u{background:var(--soft)}.b-a{border:1px solid var(--line)}
.prop{border:1px dashed var(--brand);border-radius:8px;padding:.5rem;font-size:.84rem;margin:.4rem 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:8px;font-size:.88rem;z-index:50}
.nav{display:flex;justify-content:space-between;margin-top:1rem}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}.side{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== conforto e acessibilidade cognitiva (documento 28) ===== */
html{font-size:calc(16px * var(--esc,1))}
body{font-size:calc(15px * var(--esc,1))}
.salto{position:absolute;left:-9999px;top:.4rem;z-index:50;background:var(--panel);color:var(--ink);padding:.5rem .8rem;border:2px solid var(--focus);border-radius:7px}
.salto:focus{left:.6rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#main:focus{outline:none}
[data-conf-mov="reduzido"] *,[data-conf-mov="reduzido"] *::before,[data-conf-mov="reduzido"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
[data-conf-espaco] body{line-height:1.85;letter-spacing:.02em;word-spacing:.06em}
[data-conf-espaco] .card{padding:1.3rem 1.4rem}
[data-conf-espaco] p,[data-conf-espaco] .lead{max-width:68ch}
[data-conf-fonte="legivel"] body,[data-conf-fonte="legivel"] button,[data-conf-fonte="legivel"] input,[data-conf-fonte="legivel"] select,[data-conf-fonte="legivel"] textarea{font-family:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif}
:root[data-conf-contraste]{--muted:#2F3A2C;--line:#6E7C69;--warn:#6B4206;--bad:#8E2219;--ok:#1E5C38;--sky:#1D4F78;--focus:#0B3D6B}
@media (prefers-color-scheme:dark){:root[data-conf-contraste]:not([data-theme="light"]){--muted:#D3DECF;--line:#8FA08A;--warn:#F2C77A;--bad:#F29A90;--ok:#8FD6AC;--sky:#A5CDEE;--focus:#FFFFFF}}
:root[data-theme="dark"][data-conf-contraste]{--muted:#D3DECF;--line:#8FA08A;--warn:#F2C77A;--bad:#F29A90;--ok:#8FD6AC;--sky:#A5CDEE;--focus:#FFFFFF}
#btn-conforto[aria-pressed="true"]{background:var(--brand-d);border-color:var(--brand-d);color:var(--panel)}
.proximo{border-left:5px solid var(--brand);background:var(--soft);padding:.7rem .9rem;border-radius:7px;margin:.2rem 0 1rem;max-width:80ch}
.proximo.p-bad{border-left-color:var(--bad)}.proximo.p-warn{border-left-color:var(--warn)}
dialog#conf-dlg{max-width:min(720px,94vw);border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:1.2rem 1.4rem}
dialog#conf-dlg::backdrop{background:rgba(0,0,0,.35)}
.conf-chks{display:grid;gap:.45rem;margin:.6rem 0 1rem}.conf-chk{display:flex;gap:.4rem;align-items:baseline}
dl.glos dt{font-weight:600;margin-top:.7rem}dl.glos dd{margin:.15rem 0 0}
details>summary{cursor:pointer;color:var(--brand-d);font-weight:500;padding:.3rem 0}
.toast button{margin-left:.7rem}
.tabs{flex-wrap:wrap}.tabs button{flex:1 1 auto;min-width:0}

const CONF_KEY = 'physis.conforto.v1';
const CONF_PADRAO = { modo: false, escala: 1, espaco: false, contraste: false, fonte: 'padrao', movimento: 'reduzido', simples: false, aviso: 4 };
const CONF_PRESET = { modo: true, escala: 1.15, espaco: true, contraste: true, fonte: 'legivel', movimento: 'reduzido', simples: true, aviso: 8 };

const CONF = {
  v: { ...CONF_PADRAO },

  carregar() {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(CONF_KEY) || 'null'); } catch (e) {}
    if (!o && window.matchMedia) {
      // primeira visita: respeita as preferências do sistema operacional
      if (matchMedia('(prefers-contrast: more)').matches) CONF.v.contraste = true;
    }
    if (o) CONF.v = { ...CONF_PADRAO, ...o };
    CONF.marcar();
  },

  marcar() {
    const r = document.documentElement, v = CONF.v;
    r.style.setProperty('--esc', String(v.escala || 1));
    r.toggleAttribute('data-conf-espaco', !!v.espaco);
    r.toggleAttribute('data-conf-contraste', !!v.contraste);
    r.toggleAttribute('data-conf-simples', !!v.simples);
    r.setAttribute('data-conf-fonte', v.fonte || 'padrao');
    r.setAttribute('data-conf-mov', v.movimento || 'reduzido');
  },

  aplicar(patch, silencioso) {
    CONF.v = { ...CONF.v, ...patch };
    try { localStorage.setItem(CONF_KEY, JSON.stringify(CONF.v)); } catch (e) {}
    CONF.marcar();
    if (typeof refresh === 'function' && S) refresh();
    if (!silencioso) toast('Ajustes de leitura aplicados');
  },

  alternarModo() {
    if (CONF.v.modo) CONF.aplicar({ ...CONF_PADRAO }, true), toast('Modo de conforto desligado');
    else CONF.aplicar({ ...CONF_PRESET }, true), toast('Modo de conforto ligado: texto maior, mais espaço, contraste alto e menos detalhes à vista');
  },

  // painel de ajustes (dialog nativo: foco preso e Esc fecham)
  painel() {
    let d = document.getElementById('conf-dlg');
    if (d) d.remove();
    const v = CONF.v;
    const opt = (rot, chave, ops) => h('div', { class: 'field' }, h('label', { for: 'conf_' + chave }, rot),
      h('select', { id: 'conf_' + chave, onchange: e => CONF.aplicar({ [chave]: isNaN(+e.target.value) ? e.target.value : +e.target.value }, true) },
        ...ops.map(([val, l]) => h('option', { value: val, selected: String(v[chave]) === String(val) }, l))));
    const chk = (rot, chave, dica) => h('label', { class: 'conf-chk' }, h('input', { type: 'checkbox', checked: !!v[chave], onchange: e => CONF.aplicar({ [chave]: e.target.checked }, true) }), ' ', rot, dica ? h('span', { class: 'hint' }, ' · ' + dica) : null);
    const relato = h('textarea', { rows: 3, id: 'conf_relato', style: 'width:100%', placeholder: 'O que atrapalhou? Em qual passo? (opcional: o que ajudaria)' });
    d = h('dialog', { id: 'conf-dlg', 'aria-labelledby': 'conf-tit' },
      h('h2', { id: 'conf-tit' }, 'Ajustes de leitura'),
      h('p', { class: 'lead' }, 'Tudo aqui pode ser desfeito. Os ajustes ficam salvos neste navegador.'),
      h('div', { class: 'grid' },
        opt('Tamanho do texto', 'escala', [[1, 'normal'], [1.15, 'maior'], [1.3, 'bem maior']]),
        opt('Fonte', 'fonte', [['padrao', 'padrão (Lexend)'], ['legivel', 'alta legibilidade (Atkinson Hyperlegible)']]),
        opt('Tempo dos avisos', 'aviso', [[4, '4 segundos'], [8, '8 segundos'], [15, '15 segundos']])),
      h('div', { class: 'conf-chks' },
        chk('Mais espaço entre linhas e letras', 'espaco'),
        chk('Contraste alto', 'contraste'),
        chk('Menos detalhes à vista', 'simples', 'tabelas longas ficam recolhidas'),
        chk('Sem movimento', 'movimento', 'sempre ativo; nada se move sozinho')),
      h('h3', {}, 'Relatar uma barreira'),
      h('p', { class: 'hint' }, 'Nada é enviado pela internet: o relato é baixado como arquivo para você mandar à Physis.'),
      relato,
      h('div', { class: 'row' },
        h('button', { onclick: () => {
          const txt = ['Relato de barreira · Planejador Physis', 'Data: ' + new Date().toLocaleString('pt-BR'), 'Passo: ' + STEP, 'Ajustes: ' + JSON.stringify(CONF.v), 'Navegador: ' + navigator.userAgent, '', relato.value || '(sem texto)'].join('\n');
          baixar('relato_de_barreira.txt', txt); toast('Relato baixado');
        } }, 'Baixar relato'),
        h('span', { class: 'grow' }),
        h('button', { onclick: () => CONF.aplicar({ ...CONF_PADRAO }) }, 'Voltar ao padrão'),
        h('button', { class: 'primary', onclick: () => d.close() }, 'Fechar')));
    document.body.append(d);
    d.addEventListener('close', () => { d.remove(); document.getElementById('btn-ajustes')?.focus(); });
    d.showModal();
  },

  // próximo passo: uma única orientação por tela
  proximo() {
    const R = run();
    const pend = R.chk.filter(c => c[2] === STEP).sort((a, b) => (a[0] === 'bad' ? 0 : a[0] === 'warn' ? 1 : 2) - (b[0] === 'bad' ? 0 : b[0] === 'warn' ? 1 : 2));
    const k = STEPS.findIndex(s => s[0] === STEP);
    let txt, sev;
    if (pend.length) { txt = pend[0][1]; sev = pend[0][0]; }

  depois() {
    const main = document.getElementById('main');
    if (!main) return;
    if (!main.querySelector('.proximo') && typeof run === 'function' && T.build()) {
      const h2 = main.querySelector('h2');
      try { (h2 ? h2.after.bind(h2) : main.prepend.bind(main))(CONF.proximo()); } catch (e) {}
    }
    let n = 0;
    document.querySelectorAll('.field').forEach(f => {
      const lab = f.querySelector(':scope > label'), ctl = f.querySelector('input:not([type=checkbox]):not([type=file]),select,textarea');
      if (!lab || !ctl) return;
      if (!ctl.id) ctl.id = 'auto_' + (++n) + '_' + Math.random().toString(36).slice(2, 6);
      if (!lab.htmlFor) lab.htmlFor = ctl.id;
    });
    document.querySelectorAll('table').forEach(t => {
      const cab = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
      t.querySelectorAll('tbody tr').forEach(tr => {
        const td0 = tr.querySelector('td'); const linha = (td0?.textContent.trim() || td0?.querySelector('input')?.value || '').trim();
        [...tr.children].forEach((td, i) => td.querySelectorAll('input,select,button').forEach(c => {
          if (!c.getAttribute('aria-label') && !(c.labels && c.labels.length) && !(c.tagName === 'BUTTON' && c.textContent.trim()))
            c.setAttribute('aria-label', (cab[i] || 'campo') + (linha ? ' · ' + linha : ''));
          else if (c.tagName === 'BUTTON' && !c.getAttribute('aria-label') && linha) c.setAttribute('aria-label', c.textContent.trim() + ' · ' + linha);
        }));
      });
    });
    document.querySelectorAll('select:not([id]):not([aria-label]),input:not([id]):not([aria-label]):not([type=file])').forEach(c => {
      const l = c.closest('label') || c.previousElementSibling;
      const t = (l && l.textContent.trim()) || c.getAttribute('placeholder') || 'campo';
      if (!c.closest('label')) c.setAttribute('aria-label', t);
    });
    document.querySelectorAll('.scroll').forEach(s => { s.tabIndex = 0; s.setAttribute('role', 'region'); if (!s.getAttribute('aria-label')) s.setAttribute('aria-label', 'Tabela: ' + (s.closest('.card')?.querySelector('h3')?.textContent || 'dados')); });
    if (CONF.v.simples) document.querySelectorAll('.scroll').forEach(s => {
      const linhas = s.querySelectorAll('tbody tr').length;
      if (linhas > 8 && !s.closest('details')) {
        const d = h('details', {}, h('summary', {}, `Mostrar a tabela (${linhas} linhas)`));
        s.replaceWith(d); d.append(s);
      }
    });
  }
};

    if (!ok) throw new Error('Assinatura não confere: a licença não foi emitida pela Physis ou foi alterada');
    const dados = JSON.parse(new TextDecoder().decode(LIC.b64u(d)));
    if (dados.validade && new Date(dados.validade + 'T23:59:59') < new Date()) throw new Error('Licença vencida em ' + dados.validade);
    return dados;
  },

  async ativar(token) {
    const dados = await LIC.verificar(token);
    try { localStorage.setItem(LIC_KEY, token.trim()); } catch (e) { /* navegador sem armazenamento */ }
    LIC.estado = { plano: dados.plano, modulos: dados.modulos || [], cliente: dados.cliente || '', validade: dados.validade || null, origem: 'licença', erro: '' };
    return LIC.estado;
  },

  avaliar() {
    let ini = null;
    try { ini = localStorage.getItem(LIC_AVAL_KEY); } catch (e) {}
    if (!ini) { ini = new Date().toISOString().slice(0, 10); try { localStorage.setItem(LIC_AVAL_KEY, ini); } catch (e) {} }
    const fim = new Date(ini + 'T00:00:00'); fim.setDate(fim.getDate() + LIC_AVAL_DIAS);
    if (fim < new Date()) { LIC.estado.erro = 'A avaliação de ' + LIC_AVAL_DIAS + ' dias deste navegador terminou em ' + fim.toLocaleDateString('pt-BR'); return LIC.estado; }
    LIC.estado = { plano: 'avaliação', modulos: MOD.lista.filter(m => m.estado === 'disponível').map(m => m.id), cliente: '', validade: fim.toISOString().slice(0, 10), origem: 'avaliação', erro: '' };
    return LIC.estado;
  },

  sair() {
    try { localStorage.removeItem(LIC_KEY); } catch (e) {}
    LIC.estado = { plano: 'livre', modulos: [], cliente: '', validade: null, origem: 'livre', erro: '' };
  },

  async carregar() {
    let t = null;
    try { t = localStorage.getItem(LIC_KEY); } catch (e) {}
    if (t) { try { await LIC.ativar(t); } catch (e) { LIC.estado.erro = e.message; } }
  },

  liberado(id) {
    const m = MOD.porId[id];
    if (!m) return false;
    if (m.plano === 'livre') return true;
    return LIC.estado.modulos.includes(id) || LIC.estado.modulos.includes('*');
  }
};

// SPDX-License-Identifier: AGPL-3.0-only
// Planejador Physis · registro de módulos
//
// Cada módulo chama MOD.registrar({...}) com:
//   id, nome, plano ('livre' | 'profissional' | 'especialista' | 'empresa'),
//   resumo, normas (lista), estado ('disponível' | 'planejado'),
//   padrao (parâmetros iniciais), calcular(R, p) → resultado,
//   tela(res, p) → elemento, camada (opcional) {chave, rotulo, cor(g, res, k)},
//   verificar(res, C) (opcional) e blocos(res, ad) (opcional, documento EP).
// Os parâmetros ficam em S.mod[id] e entram no histórico (desfazer) e no JSON.

const PLANOS = {
  livre:        { nome: 'Livre',        resumo: 'núcleo aberto: terreno, programa, cálculos por NBR e documento EP' },
  profissional: { nome: 'Profissional', resumo: 'otimização da implantação, perfis do terreno e escoamento SCS-CN' },
  especialista: { nome: 'Especialista', resumo: 'triagem geotécnica, aptidão, água de chuva diária e orçamento' },
  empresa:      { nome: 'Empresa',      resumo: 'todos os módulos, integrações, marca própria e suporte com prazo' }
};

const MOD = {
  lista: [], porId: {}, cache: {},

  registrar(m) { MOD.lista.push(m); MOD.porId[m.id] = m; },

  p(id) {
    const m = MOD.porId[id];
    if (!S.mod) S.mod = {};
    if (!S.mod[id]) S.mod[id] = JSON.parse(JSON.stringify(m.padrao || {}));
    return S.mod[id];
  },

  res(id) {
    const m = MOD.porId[id];
    if (!m || m.estado !== 'disponível' || !LIC.liberado(id) || !T.build()) return null;
    const chave = id + '|' + JSON.stringify(S.mod?.[id] || {});
    if (MOD.cache[chave] && MOD.cache.__calc === CALC) return MOD.cache[chave];
    if (MOD.cache.__calc !== CALC) MOD.cache = { __calc: CALC };
    try { MOD.cache[chave] = m.calcular(run(), MOD.p(id)); }
    catch (e) { MOD.cache[chave] = { erro: e.message }; }
    return MOD.cache[chave];
  },

  // ganchos chamados pelo núcleo
  camadas(g, img) {
    for (const m of MOD.lista) {
      if (!m.camada || !LAY[m.camada.chave]) continue;
      const r = MOD.res(m.id);
      if (r && !r.erro) img(raster(g, k => m.camada.cor(g, r, k)));
    }
  },
  chavesCamadas() {
    return MOD.lista.filter(m => m.camada && m.estado === 'disponível' && LIC.liberado(m.id)).map(m => [m.camada.chave, m.camada.rotulo]);
  },
  verificar(R, C) {
    for (const m of MOD.lista) {
      if (!m.verificar || m.estado !== 'disponível' || !LIC.liberado(m.id) || !S.mod?.[m.id]) continue;
      const r = MOD.res(m.id);
      if (r && !r.erro) m.verificar(r, C, R);
    }
  },
  blocos(H1, H2, P, TB) {
    const usados = MOD.lista.filter(m => m.blocos && m.estado === 'disponível' && LIC.liberado(m.id) && S.mod?.[m.id]);
    if (!usados.length) return;
    H1('Análises complementares (módulos)');
    for (const m of usados) {
      const r = MOD.res(m.id);
      if (!r || r.erro) continue;
      H2(m.nome);
      m.blocos(r, { P, TB });
    }
  }
};

// declividade suavizada (média 3 × 3) para reduzir o ruído da interpolação IDW
function declSuave(g) {
  if (g._slS) return g._slS;
  const o = new Float64Array(g.nx * g.ny);
  for (let j = 0; j < g.ny; j++) for (let i = 0; i < g.nx; i++) {
    let s = 0, n = 0;
    for (let b = -1; b <= 1; b++) for (let a = -1; a <= 1; a++) { const ii = i + a, jj = j + b; if (ii < 0 || jj < 0 || ii >= g.nx || jj >= g.ny) continue; s += g.sl[jj * g.nx + ii]; n++; }
    o[j * g.nx + i] = s / n;
  }
  return (g._slS = o);
}

// rng determinístico (resultados reproduzíveis)
function rngSemente(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// SPDX-License-Identifier: BUSL-1.1
// Módulo Profissional · otimização da implantação
// Busca em malha a posição de uma construção que minimiza corte + aterro,
// respeitando o perímetro, os recuos informados, a distância às outras
// construções e áreas com declividade acima de 100% (APP, Lei 12.651/2012).
// O giro da construção é mantido; a pessoa escolhe e aplica a proposta.

function volumeEm(it, x, y) {
  const st = Math.max(0.5, Math.min(it.w, it.d) / 8);
  const c = Math.cos((it.rot || 0) * RAD), s = Math.sin((it.rot || 0) * RAD);
  const zs = [];
  for (let a = -it.w / 2 + st / 2; a < it.w / 2; a += st)
    for (let b = -it.d / 2 + st / 2; b < it.d / 2; b += st)
      zs.push(T.z(x + a * c - b * s, y + a * s + b * c));
  const pl = zs.reduce((u, v) => u + v, 0) / zs.length;
  let ct = 0, at = 0;
  zs.forEach(z => { const d = z - pl; if (d > 0) ct += d * st * st; else at += -d * st * st; });
  return { pl, ct, at, tot: ct + at, dz: Math.max(...zs) - Math.min(...zs) };
}

MOD.registrar({
  id: 'otim', nome: 'Otimização da implantação', plano: 'profissional', estado: 'disponível',
  resumo: 'posição de menor movimento de terra para cada construção, com recuos e afastamentos',
  normas: ['NBR 11682', 'Lei 12.651/2012'],
  padrao: { item: '', passo: 1, afast: 1.5, recuo: 1.5 },
  calcular(R, p) {
    const eds = S.itens.filter(i => ['ed', 'agua', 'pav'].includes(TIPOS[i.tipo]?.cat));
    if (!eds.length) return { vazio: true };
    const it = eds.find(i => i.id === p.item) || eds.slice().sort((a, b) => (TIPOS[b.tipo].cat === 'ed') - (TIPOS[a.tipo].cat === 'ed') || b.w * b.d - a.w * a.d)[0];
    const g = T.build(), poly = S.terreno.poly;
    const rec = Math.max(p.recuo ?? 0, S.regras.recLat ?? 0);
    const outros = eds.filter(i => i.id !== it.id).map(corners);
    const atual = volumeEm(it, it.x, it.y);
    const xs = poly.map(q => q[0]), ys = poly.map(q => q[1]);
    const passo = Math.max(0.5, p.passo || 1);
    const cand = [];
    for (let x = Math.min(...xs); x <= Math.max(...xs); x += passo)
      for (let y = Math.min(...ys); y <= Math.max(...ys); y += passo) {
        const cs = corners({ ...it, x, y });
        if (!cs.every(q => GEO.inside(q, poly))) continue;
        if (rec && Math.min(...cs.map(q => GEO.distPoly(q, poly))) < rec) continue;
        if (outros.some(o => polyDist(cs, o) < (p.afast ?? 0))) continue;
        const fi = Math.round((x - g.x0) / g.cs), fj = Math.round((y - g.y0) / g.cs);
        if (g.sl[fj * g.nx + fi] > 100) continue;
        const v = volumeEm(it, x, y);
        cand.push({ x, y, ...v, dist: Math.hypot(x - it.x, y - it.y) });
      }
    cand.sort((a, b) => a.tot - b.tot);
    const melhores = [];
    for (const c of cand) { if (melhores.every(m => Math.hypot(m.x - c.x, m.y - c.y) > 4)) melhores.push(c); if (melhores.length === 5) break; }
    return { it, eds, atual, melhores, testadas: cand.length };
  },
  tela(r, p) {
    if (r.vazio) return h('p', { class: 'hint' }, 'Inclua construções no passo 3.');
    const ganho = r.melhores[0] ? (1 - r.melhores[0].tot / (r.atual.tot || 1)) * 100 : 0;
    return h('div', {},
      h('div', { class: 'grid' },
        h('div', { class: 'field' }, h('label', {}, 'Construção'),
          h('select', { onchange: e => mutate(() => { MOD.p('otim').item = e.target.value; }, 'otimização: construção') },
            ...r.eds.map(i => h('option', { value: i.id, selected: i.id === r.it.id }, i.nome)))),
        mfld('otim', 'passo', 'Passo da busca', { unit: 'm', min: 0.5 }),
        mfld('otim', 'recuo', 'Recuo mínimo das divisas', { unit: 'm', min: 0, dica: 'o maior entre este e o recuo lateral do município' }),
        mfld('otim', 'afast', 'Afastamento entre construções', { unit: 'm', min: 0 })),
      kpis([[NF(r.atual.tot, 1) + ' m³', 'corte + aterro na posição atual'], [r.melhores[0] ? NF(r.melhores[0].tot, 1) + ' m³' : '—', 'na melhor posição'], [NF(ganho, 0) + '%', 'redução'], [String(r.testadas), 'posições testadas']]),
      tbl(['Proposta', 'Centro (x; y)', 'Cota da plataforma', 'Corte (m³)', 'Aterro (m³)', 'Desnível', 'Distância da posição atual', ''],
        r.melhores.map((c, k) => [String(k + 1), NF(c.x, 1) + '; ' + NF(c.y, 1), NF(c.pl, 2), NF(c.ct, 1), NF(c.at, 1), NF(c.dz, 2) + ' m', NF(c.dist, 1) + ' m',
          h('button', { onclick: () => mutate(() => { const i = S.itens.find(q => q.id === r.it.id); i.x = +c.x.toFixed(2); i.y = +c.y.toFixed(2); i.cota = null; }, 'posição otimizada: ' + r.it.nome) }, 'Aplicar')])),
      h('p', { class: 'hint' }, 'A busca não conhece o programa (vizinhança desejada, vistas, acessos): use as propostas como ponto de partida e confira no mapa.'));
  },
  blocos(r, { P, TB }) {
    if (r.vazio || !r.melhores.length) return;
    P(`${r.it.nome}: corte + aterro de ${NF(r.atual.tot, 1)} m³ na posição atual; a melhor posição testada tem ${NF(r.melhores[0].tot, 1)} m³ (${r.testadas} posições, recuos e afastamentos aplicados).`);
    TB(['Proposta', 'Centro (x; y)', 'Cota', 'Corte + aterro (m³)'], r.melhores.map((c, k) => [String(k + 1), NF(c.x, 1) + '; ' + NF(c.y, 1), NF(c.pl, 2), NF(c.tot, 1)]));
  }
});

// SPDX-License-Identifier: BUSL-1.1
// Módulo Profissional · perfis do terreno
// Corte do terreno entre dois pontos, com as plataformas das construções
// cortadas pela linha. Sem pontos informados, usa a linha do ponto mais alto
// ao mais baixo do perímetro (maior desnível do lote).

MOD.registrar({
  id: 'perfil', nome: 'Perfis do terreno', plano: 'profissional', estado: 'disponível',
  resumo: 'corte do terreno em qualquer linha, com as plataformas das construções',
  normas: ['NBR 13133'],
  padrao: { x1: null, y1: null, x2: null, y2: null, n: 120 },
  calcular(R, p) {
    const poly = S.terreno.poly;
    let a = [p.x1, p.y1], b = [p.x2, p.y2];
    if ([p.x1, p.y1, p.x2, p.y2].some(v => v == null)) {
      const zs = poly.map(q => T.z(q[0], q[1]));
      a = poly[zs.indexOf(Math.max(...zs))]; b = poly[zs.indexOf(Math.min(...zs))];
    }
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(20, Math.min(400, p.n || 120));
    const pts = [];
    for (let k = 0; k <= n; k++) { const t = k / n; const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t; pts.push([t * L, T.z(x, y), GEO.inside([x, y], poly)]); }
    const terra = Object.fromEntries((R.terra || []).map(t => [t.nome, t.pl]));
    const cortes = [];
    for (const it of S.itens) {
      if (!['ed', 'agua', 'pav'].includes(TIPOS[it.tipo]?.cat)) continue;
      const cs = corners(it);
      const dentro = pts.map((q, k) => { const t = k / n; return GEO.inside([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], cs); });
      const i0 = dentro.indexOf(true), i1 = dentro.lastIndexOf(true);
      if (i0 >= 0) cortes.push({ nome: it.nome, s0: pts[i0][0], s1: pts[i1][0], pl: it.cota ?? terra[it.nome] ?? pts[i0][1], cor: TIPOS[it.tipo].cor });
    }
    const zs = pts.map(q => q[1]);
    return { a, b, L, pts, cortes, zmin: Math.min(...zs, ...cortes.map(c => c.pl)), zmax: Math.max(...zs, ...cortes.map(c => c.pl)), decl: (Math.max(...zs) - Math.min(...zs)) / (L || 1) * 100 };
  },
  svg(r) {
    const W = 860, H = 260, m = 40;
    const X = s => m + s / (r.L || 1) * (W - 2 * m);
    const Y = z => H - m - (z - r.zmin) / ((r.zmax - r.zmin) || 1) * (H - 2 * m);
    const linha = r.pts.map((q, k) => (k ? 'L' : 'M') + X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join('');
    const solo = linha + `L${X(r.L)},${H - m}L${X(0)},${H - m}Z`;
    const pl = r.cortes.map(c => `<rect x="${X(c.s0)}" y="${Y(c.pl) - 8}" width="${Math.max(2, X(c.s1) - X(c.s0))}" height="8" fill="${c.cor}" opacity=".85"/><text x="${X(c.s0)}" y="${Y(c.pl) - 12}" font-size="10" fill="currentColor">${esc(c.nome)} ${NF(c.pl, 2)}</text>`).join('');
    const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => { const z = r.zmin + t * (r.zmax - r.zmin); return `<text x="4" y="${Y(z) + 3}" font-size="10" fill="currentColor">${NF(z, 1)}</text><line x1="${m}" x2="${W - m}" y1="${Y(z)}" y2="${Y(z)}" stroke="currentColor" stroke-opacity=".12"/>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Perfil do terreno">${ticks}<path d="${solo}" fill="#C9B48A" fill-opacity=".45"/><path d="${linha}" stroke="#8A6A3A" stroke-width="2" fill="none"/>${pl}<text x="${W - m}" y="${H - 8}" font-size="10" text-anchor="end" fill="currentColor">${NF(r.L, 1)} m</text></svg>`;
  },
  tela(r, p) {
    return h('div', {},
      h('div', { class: 'grid' },
        mfld('perfil', 'x1', 'Início x', { unit: 'm' }), mfld('perfil', 'y1', 'Início y', { unit: 'm' }),
        mfld('perfil', 'x2', 'Fim x', { unit: 'm' }), mfld('perfil', 'y2', 'Fim y', { unit: 'm' })),
      h('p', { class: 'hint' }, `Linha de (${NF(r.a[0], 1)}; ${NF(r.a[1], 1)}) a (${NF(r.b[0], 1)}; ${NF(r.b[1], 1)}): ${NF(r.L, 1)} m, desnível de ${NF(r.zmax - r.zmin, 1)} m, declividade média de ${NF(r.decl, 0)}%. Deixe os campos vazios para a linha de maior desnível.`),
      h('div', { html: MOD.porId.perfil.svg(r) }));
  },

// Segundo método para o volume excedente, comparado ao método racional do
// núcleo. CN por cobertura e grupo hidrológico do solo (tabela TR-55);
// chuva de projeto pela equação IDF do passo 2.

const CN_TAB = { // grupo A, B, C, D
  impermeavel: [98, 98, 98, 98],
  gramado:     [39, 61, 74, 80],
  mata:        [30, 55, 70, 77],
  horta:       [49, 69, 79, 84],
  solo_exposto:[77, 86, 91, 94]
};
const CN_COB = { ed: 'impermeavel', pav: 'impermeavel', agua: 'impermeavel', inf: 'impermeavel' };

MOD.registrar({
  id: 'scs', nome: 'Escoamento pelo método SCS-CN', plano: 'profissional', estado: 'disponível',
  resumo: 'segundo método para o volume excedente da chuva, por cobertura e tipo de solo',
  normas: ['NBR 10844', 'USDA NRCS TR-55'],
  padrao: { grupo: 2, existente: 'mata', duracao: 120 },
  calcular(R, p) {
    const idf = S.clima.idf;
    if (!idf.K) return { erro: 'informe a equação de chuvas intensas no passo 2' };
    const g = Math.max(0, Math.min(3, (p.grupo ?? 2) | 0));
    const A = R.A, t = p.duracao || 120, Tr = S.premissas.Tr;
    const i = idf.K * Tr ** idf.a / (t + idf.b) ** idf.c, P = i * t / 60;
    const cnEx = CN_TAB[p.existente || 'mata'][g];
    let somaA = 0, somaCN = 0;
    for (const it of S.itens) {
      const cat = TIPOS[it.tipo]?.cat; if (!cat || cat === 'ponto') continue;
      const cob = CN_COB[cat] || (it.tipo === 'gramado' ? 'gramado' : it.tipo === 'horta' ? 'horta' : it.tipo === 'mata' ? 'mata' : 'gramado');
      const a = areaItem(it); somaA += a; somaCN += a * CN_TAB[cob][g];
    }
    const resto = Math.max(0, A - somaA);
    const cnPos = (somaCN + resto * cnEx) / (A || 1);
    const Q = cn => { const Sx = 25400 / cn - 254, Ia = 0.2 * Sx; return P <= Ia ? 0 : (P - Ia) ** 2 / (P - Ia + Sx); };
    const qPre = Q(cnEx), qPos = Q(cnPos);
    return { P, i, cnEx, cnPos, qPre, qPos, V: (qPos - qPre) * A / 1000, Vrac: R.V2h, t, Tr, g };
  },
  tela(r, p) {
    if (r.erro) return h('p', { class: 'hint' }, r.erro);
    return h('div', {},
      h('div', { class: 'grid' },
        h('div', { class: 'field' }, h('label', {}, 'Grupo hidrológico do solo'),
          h('select', { onchange: e => mutate(() => { MOD.p('scs').grupo = +e.target.value; }, 'SCS: grupo do solo') },
            ...['A (arenoso, infiltra muito)', 'B', 'C', 'D (argiloso, infiltra pouco)'].map((l, k) => h('option', { value: k, selected: k === r.g }, l)))),
        h('div', { class: 'field' }, h('label', {}, 'Cobertura antes da obra'),
          h('select', { onchange: e => mutate(() => { MOD.p('scs').existente = e.target.value; }, 'SCS: cobertura existente') },
            ...[['mata', 'mata'], ['gramado', 'pasto ou gramado'], ['solo_exposto', 'solo exposto']].map(([v, l]) => h('option', { value: v, selected: v === p.existente }, l)))),
        mfld('scs', 'duracao', 'Duração da chuva', { unit: 'min', min: 10 })),
      kpis([[NF(r.P, 1) + ' mm', `chuva de ${r.t} min, T = ${r.Tr} anos`], [NF(r.cnEx, 0) + ' → ' + NF(r.cnPos, 1), 'CN antes → depois'], [NF(r.V, 1) + ' m³', 'excedente (SCS-CN)'], [r.Vrac != null ? NF(r.Vrac, 1) + ' m³' : '—', 'excedente (racional, núcleo)']]),
      h('p', { class: 'hint' }, 'Diferenças de até 30% entre os dois métodos são comuns; adote o maior para a detenção e confirme com o ensaio de infiltração.'));
  },
  verificar(r, C) {
    if (r.erro || r.Vrac == null) return;

  },
  blocos(r, { P }) {

  }
});

// SPDX-License-Identifier: BUSL-1.1
// Módulo Especialista · triagem geotécnica por talude infinito
// FS = [c' + (γ − m·γw)·z·cos²β·tan φ'] / (γ·z·sen β·cos β)
// m = fração saturada da camada (0 seco, 1 saturado). Mapa de FS e bloqueio de
// infiltração onde o FS saturado < 1,5. É triagem: não substitui sondagem,
// ensaios e o estudo de estabilidade pela NBR 11682.

MOD.registrar({
  id: 'geo', nome: 'Triagem geotécnica da encosta', plano: 'especialista', estado: 'disponível',
  resumo: 'fator de segurança por talude infinito, seco e saturado, e zonas onde não infiltrar',
  normas: ['NBR 11682', 'NBR 6484'],
  padrao: { c: 8, phi: 30, gama: 18, z: 1.5, m: 1, fsMin: 1.5 },
  camada: { chave: 'mod_geo', rotulo: 'fator de segurança (saturado)',
    cor: (g, r, k) => { const f = r.FS[k]; return f < 1 ? [170, 30, 40, 210] : f < (r.fsMin) ? [230, 120, 40, 190] : f < 2 ? [240, 210, 90, 150] : null; } },
  calcular(R, p) {
    const g = T.build();
    const c = p.c ?? 8, ph = (p.phi ?? 30) * RAD, gm = p.gama ?? 18, z = p.z ?? 1.5, m = Math.max(0, Math.min(1, p.m ?? 1)), gw = 9.81;
    const SL = declSuave(g);
    const fs = mm => { const out = new Float64Array(g.nx * g.ny); for (let k = 0; k < out.length; k++) { const b = Math.atan(SL[k] / 100); const den = gm * z * Math.sin(b) * Math.cos(b); out[k] = den < 1e-6 ? 99 : (c + (gm - mm * gw) * z * Math.cos(b) ** 2 * Math.tan(ph)) / den; } return out; };
    const FS = fs(m), FS0 = fs(0);
    const conta = (A, lim) => { let n = 0, t = 0; for (let k = 0; k < A.length; k++) if (g.ins[k]) { t++; if (A[k] < lim) n++; } return n / (t || 1); };
    const lim = p.fsMin ?? 1.5;
    const inf = S.itens.filter(i => ['infiltracao', 'tratamento'].includes(i.tipo)).map(i => {
      const cs = corners(i); let pior = 99;
      for (let k = 0; k < FS.length; k++) { if (!g.ins[k]) continue; const ii = k % g.nx, jj = (k - ii) / g.nx; if (GEO.inside([g.x0 + ii * g.cs, g.y0 + jj * g.cs], cs)) pior = Math.min(pior, FS[k]); }
      if (pior === 99) pior = FS[Math.round((i.y - g.y0) / g.cs) * g.nx + Math.round((i.x - g.x0) / g.cs)];
      return { nome: i.nome, fs: pior, tipo: i.tipo };
    });
    return { FS, fsMin: lim, seco: conta(FS0, lim), sat: conta(FS, lim), rupt: conta(FS, 1), inf, p };
  },
  tela(r) {
    return h('div', {},
      h('div', { class: 'grid' },
        mfld('geo', 'c', "Coesão efetiva c'", { unit: 'kPa', min: 0 }), mfld('geo', 'phi', "Ângulo de atrito φ'", { unit: '°', min: 0, max: 50 }),
        mfld('geo', 'gama', 'Peso específico γ', { unit: 'kN/m³', min: 10 }), mfld('geo', 'z', 'Profundidade da camada', { unit: 'm', min: 0.3 }),
        mfld('geo', 'm', 'Fração saturada m', { min: 0, max: 1, dica: '0 seco · 1 saturado (chuva intensa ou infiltração)' }), mfld('geo', 'fsMin', 'FS mínimo de referência', { min: 1 })),
      kpis([[NF(r.seco * 100, 1) + '%', 'área com FS abaixo do mínimo (seco)'], [NF(r.sat * 100, 1) + '%', 'área com FS abaixo do mínimo (m informado)'], [NF(r.rupt * 100, 1) + '%', 'área com FS < 1']]),
      r.inf.length ? tbl(['Infiltração ou tratamento', 'FS no local', 'Situação'], r.inf.map(i => [i.nome, NF(i.fs, 2), h('span', { class: 'tag ' + (i.fs < r.fsMin ? (i.tipo === 'infiltracao' ? 't-bad' : 't-warn') : 't-ok') }, i.fs < r.fsMin ? (i.tipo === 'infiltracao' ? 'não infiltrar aqui' : 'tanque estanque; infiltrar fora daqui') : 'possível, após ensaio')])) : null,
      h('p', { class: 'hint' }, 'Parâmetros típicos até a sondagem SPT e os ensaios de laboratório. Ative a camada “fator de segurança” no mapa do passo 3.'));
  },
  verificar(r, C) {
    if (r.sat > 0.05) C('warn', `${NF(r.sat * 100, 0)}% do lote com FS < ${NF(r.fsMin, 1)} na condição saturada: estudo de estabilidade antes de infiltrar ou cortar`, 'modulos', 'NBR 11682');
    r.inf.filter(i => i.fs < r.fsMin).forEach(i => i.tipo === 'infiltracao'
      ? C('bad', `${i.nome} em área com FS ${NF(i.fs, 2)} na condição saturada: não infiltrar neste local`, 'modulos', 'NBR 11682')
      : C('warn', `${i.nome} em área com FS ${NF(i.fs, 2)} saturado: tanque estanque; sumidouro ou vala só fora desta área`, 'modulos', 'NBR 13969'));
  },
  blocos(r, { P, TB }) {
    P(`Talude infinito com c' = ${r.p.c} kPa, φ' = ${r.p.phi}°, γ = ${r.p.gama} kN/m³ e camada de ${r.p.z} m (parâmetros estimados): ${NF(r.seco * 100, 1)}% do lote abaixo de FS ${NF(r.fsMin, 1)} seco e ${NF(r.sat * 100, 1)}% com m = ${r.p.m}. Triagem; o estudo de estabilidade pela NBR 11682 é obrigatório.`);

  }
});

// SPDX-License-Identifier: BUSL-1.1
// Módulo Especialista · aptidão multicritério para construir
// Soma ponderada de critérios normalizados de 0 a 1: declividade, exposição ao
// sol, proximidade dos acessos e distância dos caminhos da água. Pesos
// editáveis; resultado em mapa e nas construções já desenhadas.

MOD.registrar({
  id: 'apt', nome: 'Aptidão do terreno para construir', plano: 'especialista', estado: 'disponível',
  resumo: 'mapa de aptidão por declividade, sol, acesso e água, com nota de cada construção',
  normas: ['Lei 12.651/2012', 'Lei 6.766/1979'],
  padrao: { wDecl: 0.45, wSol: 0.25, wAce: 0.2, wAgua: 0.1, declMax: 60 },
  camada: { chave: 'mod_apt', rotulo: 'aptidão para construir',
    cor: (g, r, k) => { const v = r.A[k]; return v > 0.6 ? [70, 140, 70, 170] : v > 0.4 ? [230, 200, 80, 150] : [190, 70, 50, 170]; } },
  calcular(R, p) {
    const g = T.build();
    const aces = S.itens.filter(i => i.tipo === 'acesso');
    const diag = Math.hypot(g.nx * g.cs, g.ny * g.cs);
    const th = Math.max(25, g.nx * g.ny * 0.004);
    const w = [p.wDecl ?? 0.45, p.wSol ?? 0.25, aces.length ? (p.wAce ?? 0.2) : 0, p.wAgua ?? 0.1];
    const sw = w.reduce((a, b) => a + b, 0) || 1;
    const SL = declSuave(g);
    const A = new Float64Array(g.nx * g.ny);
    let alta = 0, media = 0, baixa = 0, n = 0;
    for (let k = 0; k < A.length; k++) {
      if (!g.ins[k]) continue;
      const i = k % g.nx, j = (k - i) / g.nx, x = g.x0 + i * g.cs, y = g.y0 + j * g.cs;
      const fDecl = clamp(1 - SL[k] / (p.declMax || 60), 0, 1);
      const fSol = clamp((g.sol[k] - 0.6) / 0.6, 0, 1);
      const fAce = aces.length ? clamp(1 - Math.min(...aces.map(a => Math.hypot(a.x - x, a.y - y))) / (diag / 2), 0, 1) : 0;
      const fAgua = g.acc[k] > th ? 0 : 1;
      const v = SL[k] > 100 ? 0 : (w[0] * fDecl + w[1] * fSol + w[2] * fAce + w[3] * fAgua) / sw;
      A[k] = v; n++; if (v > 0.6) alta++; else if (v > 0.4) media++; else baixa++;
    }
    const notas = ED().map(it => { const cs = corners(it); let s = 0, c = 0; for (let k = 0; k < A.length; k++) { if (!g.ins[k]) continue; const ii = k % g.nx, jj = (k - ii) / g.nx; if (GEO.inside([g.x0 + ii * g.cs, g.y0 + jj * g.cs], cs)) { s += A[k]; c++; } } return { nome: it.nome, nota: c ? s / c : A[Math.round((it.y - g.y0) / g.cs) * g.nx + Math.round((it.x - g.x0) / g.cs)] }; });
    return { A, alta: alta / (n || 1), media: media / (n || 1), baixa: baixa / (n || 1), notas, semAcesso: !aces.length };
  },
  tela(r) {
    return h('div', {},
      h('div', { class: 'grid' },
        mfld('apt', 'wDecl', 'Peso da declividade', { min: 0 }), mfld('apt', 'wSol', 'Peso do sol', { min: 0 }),
        mfld('apt', 'wAce', 'Peso da proximidade do acesso', { min: 0 }), mfld('apt', 'wAgua', 'Peso da distância da água', { min: 0 }),
        mfld('apt', 'declMax', 'Declividade sem aptidão', { unit: '%', min: 10 })),
      kpis([[NF(r.alta * 100, 1) + '%', 'aptidão alta'], [NF(r.media * 100, 1) + '%', 'média'], [NF(r.baixa * 100, 1) + '%', 'baixa ou APP']]),
      r.notas.length ? tbl(['Construção', 'Nota de aptidão (0 a 1)', 'Leitura'], r.notas.map(n => [n.nome, NF(n.nota, 2), n.nota > 0.6 ? 'boa' : n.nota > 0.4 ? 'aceitável' : 'rever posição'])) : null,
      r.semAcesso ? h('p', { class: 'hint' }, 'Sem acesso desenhado: o critério de proximidade foi ignorado.') : null,
      h('p', { class: 'hint' }, 'Ative a camada “aptidão para construir” no mapa do passo 3. Declividade acima de 100% conta como APP.'));
  },
  verificar(r, C) { r.notas.filter(n => n.nota <= 0.4).forEach(n => C('info', `${n.nome} em área de aptidão baixa (${NF(n.nota, 2)}): considere outra posição`, 'modulos')); },
  blocos(r, { P, TB }) {
    P(`Aptidão alta em ${NF(r.alta * 100, 1)}% do lote, média em ${NF(r.media * 100, 1)}% e baixa ou APP em ${NF(r.baixa * 100, 1)}%.`);
    if (r.notas.length) TB(['Construção', 'Nota (0 a 1)'], r.notas.map(n => [n.nome, NF(n.nota, 2)]));
  }
});

// SPDX-License-Identifier: BUSL-1.1
// Módulo Especialista · água de chuva por simulação diária
// Gera séries diárias de chuva (ocorrência por mês e altura exponencial) que
// respeitam a chuva mensal do passo 2 e simula a cisterna dia a dia por
// centenas de anos. Mais realista que o balanço mensal do núcleo (NBR 15527).

MOD.registrar({
  id: 'chuva', nome: 'Água de chuva por simulação diária', plano: 'especialista', estado: 'disponível',
  resumo: 'cobertura e dias com água da rede para vários volumes de cisterna, com chuva diária simulada',
  normas: ['NBR 15527'],
  padrao: { anos: 300, v1: null, v2: null, v3: null, dias: [], coef: 0.8, semente: 42 },
  calcular(R, p) {
    if (!S.sistemas.chuva) return { erro: 'ative a captação de chuva no passo 3' };
    if (!R.chuva) return { erro: 'informe a chuva mensal (12 valores) no passo 2' };
    const ch = S.clima.chuva, dm = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const diasEst = !(p.dias && p.dias.length === 12);
    const dias = diasEst ? ch.map((c, m) => clamp(Math.round(2 + c / 12), 3, dm[m] - 2)) : p.dias;
    const roof = R.chuva.roofs, demDia = R.chuva.dem / 30.4, coef = p.coef ?? 0.8;
    const base = R.chuva.V;
    const vols = [p.v1 ?? Math.round(base * 0.5), p.v2 ?? base, p.v3 ?? Math.round(base * 1.5)].filter(v => v > 0);
    const anos = clamp(p.anos || 300, 20, 2000);
    const sim = V => {
      const rnd = rngSemente(p.semente ?? 42);
      let est = V, falta = 0, tot = 0, dRede = 0, n = 0;
      for (let a = 0; a < anos; a++) for (let m = 0; m < 12; m++) {
        const pw = dias[m] / dm[m], mu = ch[m] / (dias[m] || 1);
        for (let d = 0; d < dm[m]; d++) {
          const r = rnd() < pw ? -mu * Math.log(1 - rnd()) : 0;
          est = Math.min(V, est + roof * r * coef / 1000) - demDia; tot += demDia; n++;
          if (est < 0) { falta += -est; est = 0; dRede++; }
        }
      }
      return { V, cob: 1 - falta / (tot || 1), dias: dRede / n };
    };
    const oferta = roof * ch.reduce((a, b) => a + b, 0) * coef / 1000, demanda = demDia * 365;
    return { linhas: vols.map(sim), mensal: R.chuva, diasEst, dias, anos, roof, demDia, oferta, demanda };
  },
  tela(r) {
    if (r.erro) return h('p', { class: 'hint' }, r.erro);
    return h('div', {},
      h('div', { class: 'grid' },
        mfld('chuva', 'v1', 'Volume 1', { unit: 'm³', min: 1 }), mfld('chuva', 'v2', 'Volume 2', { unit: 'm³', min: 1 }), mfld('chuva', 'v3', 'Volume 3', { unit: 'm³', min: 1 }),
        mfld('chuva', 'anos', 'Anos simulados', { min: 20, max: 2000 }), mfld('chuva', 'coef', 'Coeficiente de aproveitamento', { min: 0.5, max: 0.95 }),
        mpaste('chuva', 'dias', 'Dias de chuva por mês', 'dias')),
      r.oferta < r.demanda ? h('p', { class: 'hint' }, `A chuva captada no ano (≈ ${NF(r.oferta, 0)} m³) é menor que a demanda não potável (≈ ${NF(r.demanda, 0)} m³): aumentar a cisterna não resolve; amplie a área de captação ou reduza a demanda.`) : null,
      tbl(['Cisterna', 'Cobertura dos usos não potáveis', 'Dias com água da rede'], r.linhas.map(l => [NF(l.V, 0) + ' m³', NF(l.cob * 100, 1) + '%', NF(l.dias * 100, 1) + '%'])),
      h('p', { class: 'hint' }, `Telhados de ${NF(r.roof, 0)} m², demanda de ${NF(r.demDia, 2)} m³/dia, ${r.anos} anos simulados. Balanço mensal do núcleo: ${NF(r.mensal.V, 0)} m³ cobre ${NF(r.mensal.cob * 100, 0)}%. ` + (r.diasEst ? 'Dias de chuva estimados pela chuva mensal; use a normal climatológica do INMET para confirmar.' : 'Dias de chuva informados.')));
  },
  blocos(r, { P, TB }) {
    if (r.erro) return;
    P(`Simulação diária de ${r.anos} anos (chuva mensal do projeto, ${r.diasEst ? 'dias de chuva estimados' : 'dias de chuva informados'}):`);
    TB(['Cisterna', 'Cobertura', 'Dias com rede'], r.linhas.map(l => [NF(l.V, 0) + ' m³', NF(l.cob * 100, 1) + '%', NF(l.dias * 100, 1) + '%']));
  }
});

// SPDX-License-Identifier: BUSL-1.1
// Módulo Especialista · orçamento paramétrico e desembolso por fase
// Custos unitários informados pela pessoa (com fonte e data: SINAPI, CUB,
// cotação) por tipo de construção, terraplenagem e sistemas. O planejador não
// traz preços próprios: sem custo informado, o item aparece como pendente.

const ORC_UN = { ed: 'm² construído', pav: 'm²', agua: 'm²', perm: 'm²', inf: 'unidade' };

MOD.registrar({
  id: 'orc', nome: 'Orçamento paramétrico', plano: 'especialista', estado: 'disponível',
  resumo: 'custo por item, terraplenagem e sistemas a partir de custos unitários com fonte, e desembolso por fase',
  normas: ['Decreto 7.983/2013 (referência SINAPI)', 'NBR 12721 (CUB)'],
  padrao: { cu: {}, fonte: '', data: '', corte: null, aterro: null, kwp: null, kwh: null, cist: null, cont: 15, bdi: 0, fase: {} },
  calcular(R, p) {
    const linhas = []; let pend = 0;
    const add = (nome, q, un, cu, fase) => { const v = cu != null ? q * cu : null; if (v == null) pend++; linhas.push({ nome, q, un, cu, v, fase: fase || 1 }); };
    for (const it of S.itens) {
      const t = TIPOS[it.tipo]; if (!t || t.cat === 'ponto') continue;
      const q = t.cat === 'ed' ? it.w * it.d * (it.pav || 1) : t.cat === 'inf' ? 1 : areaItem(it);
      add(it.nome, q, ORC_UN[t.cat], p.cu?.[it.tipo] ?? null, p.fase?.[it.id]);
    }
