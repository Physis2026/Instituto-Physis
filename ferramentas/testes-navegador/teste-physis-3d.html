<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Teste Physis 3D</title>
<script>
/* stubs dos globais da plataforma (mesmas definições do painel.html) */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const n2 = (v, c) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const el = id => document.getElementById(id);
const ui = { modo: "arquivo" };
function desenhar(){ const t = el("tela"); if (t) t.innerHTML = telaPhysis3D(); }
</script>
<script src="../../sistema/physis-3d.js"></script>
</head><body><h2>Teste de window.PHYSIS3D (mesmos números de physis-hub/tests/test_impressao3d.py)</h2>
<pre id="saida">rodando…</pre>
<p><button type="button" id="ver-cubo">Abrir o cubo de 20 mm na tela</button></p>
<div id="tela"></div>
<script>
(async () => {
  const s = el("saida"); let linhas = [], falhas = 0;
  try {
    const { r } = PHYSIS3D.autoteste(); const r2 = await PHYSIS3D.autoteste3MF();
    r.concat(r2).forEach(x => { if (!x.ok) falhas++; linhas.push((x.ok ? "ok    " : "FALHA ") + x.nome + (x.ok ? "" : "  → " + x.info)); });
  } catch (e) { falhas++; linhas.push("ERRO " + (e && e.stack || e)); }
  s.textContent = (falhas ? falhas + " FALHA(S)\n" : "TUDO OK\n") + linhas.join("\n");
  document.title = falhas ? "FALHOU" : "OK";
  window.__resultado = { falhas, linhas };
})();
el("ver-cubo").onclick = () => { const T = PHYSIS3D.cubo(20); ui.p3d = { T, T0: T, med: PHYSIS3D.medir(T), versao: 1, nome: "cubo.stl", pilha: [] }; desenhar(); };
desenhar();
</script></body></html>
