
; ══════════════════════════════════════════════════════════════════════════════
;  Nó transmissor V6 — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
;  Par do `Projeto Receptor V6`.
;  Rede de até 99 nós (teto do protocolo: `ID:` tem dois dígitos).
;
;  ─── UMA IMAGEM PARA TODAS AS PLACAS (padrão) ────────────────────────────────
;
;      pio run -t upload
;
;  A placa sobe SEM identidade, não transmite nada e avisa no OLED. Comissione
;  uma vez pela serial:
;
;      pio device monitor -b 115200
;      id 7          <- grava o ID 7 na NVS
;      id            <- confere
;
;  Depois disso a identidade sobrevive a regravações do firmware (fica na NVS,
;  não no binário). ETIQUETE A PLACA com o número na hora de comissionar.
;
;  ─── UMA IMAGEM POR NÓ (legado) ──────────────────────────────────────────────
;
;      pio run -e no1 -t upload
;
;  Os envs `no1`..`no4` existem só para as placas já gravadas com o esquema
;  antigo. Com `-D NODE_ID` a identidade vem do binário e o comando `id` é
;  recusado. Não use isso para placas novas: são N imagens para gravar e
;  etiquetar, e um engano no meio põe duas placas no mesmo setor.
;
;  Para mudar o ciclo TDMA você NÃO precisa regravar os nós: o cronograma
;  (ciclo/slot/guarda) viaja dentro do beacon do receptor.
; ══════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = no

[nodo]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    ropg/heltec_esp32_lora_v3
    ; Mesma versão EXATA no receptor: a heltec_esp32_lora_v3 puxa a RadioLib sem
    ; versão, e cada projeto acabava com uma (7.6.0 lá, 7.7.1 aqui).
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
build_flags =
    -UARDUINO_USB_CDC_ON_BOOT
    -include Arduino.h

; ─── A imagem única: sem NODE_ID, identidade vem da NVS ───────────────────────
[env:no]
platform      = ${nodo.platform}
board         = ${nodo.board}
framework     = ${nodo.framework}
monitor_speed = ${nodo.monitor_speed}
lib_deps      = ${nodo.lib_deps}
build_flags   = ${nodo.build_flags}

; ─── Legado: uma imagem por nó ────────────────────────────────────────────────
[env:no1]
platform      = ${nodo.platform}
board         = ${nodo.board}
framework     = ${nodo.framework}
monitor_speed = ${nodo.monitor_speed}
lib_deps      = ${nodo.lib_deps}
build_flags   = ${nodo.build_flags} -D NODE_ID=1

[env:no2]
platform      = ${nodo.platform}
board         = ${nodo.board}
framework     = ${nodo.framework}
monitor_speed = ${nodo.monitor_speed}
lib_deps      = ${nodo.lib_deps}
build_flags   = ${nodo.build_flags} -D NODE_ID=2

[env:no3]
platform      = ${nodo.platform}
board         = ${nodo.board}
framework     = ${nodo.framework}
monitor_speed = ${nodo.monitor_speed}
lib_deps      = ${nodo.lib_deps}
build_flags   = ${nodo.build_flags} -D NODE_ID=3

[env:no4]
platform      = ${nodo.platform}
board         = ${nodo.board}
framework     = ${nodo.framework}
monitor_speed = ${nodo.monitor_speed}
lib_deps      = ${nodo.lib_deps}
build_flags   = ${nodo.build_flags} -D NODE_ID=4
