; ══════════════════════════════════════════════════════════════════════════════
;  RECEPTOR / GATEWAY V6 — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
;
;  Mestre TDMA dos nós de campo (até 99) + painel local + ponte para o controle central
;  no Raspberry Pi. Uma imagem só. Par do firmware `Transmissor V6 - No LoRa V3`
;  (que também usa uma imagem só, com a identidade comissionada pela NVS).
;
;  Os segredos (senha do WiFi, chaves de API) têm default em `src/config.h`, mas
;  todos podem ser sobrescritos aqui sem tocar no código. Para não versionar
;  credencial, descomente e ajuste — este arquivo é o lugar certo para isso:
;
;    build_flags =
;        ${env.build_flags}
;        -D WIFI_SSID=\"minha-rede\"
;        -D WIFI_PASS=\"minha-senha\"
;        -D WEATHER_API_KEY=\"...\"
;        -D WA_APIKEY=\"...\"
;        -D PI_HOST_PADRAO=\"192.168.1.50\"
; ══════════════════════════════════════════════════════════════════════════════

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    ropg/heltec_esp32_lora_v3
    ; Mesma versão EXATA nos nós: a heltec_esp32_lora_v3 puxa a RadioLib sem
    ; versão, e cada projeto acabava com uma (7.6.0 aqui, 7.7.1 lá).
    jgromes/RadioLib@7.7.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
build_flags =
    -UARDUINO_USB_CDC_ON_BOOT
    -include Arduino.h
